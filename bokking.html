<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booking System | Notes Fixed</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #8b5cf6;
            --dark: #334155;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding: 10px;
            width: 100%;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1400px; 
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @media (min-width: 1024px) {
            .container { display: grid; grid-template-columns: 380px 1fr; }
            body { padding: 24px; padding-bottom: 24px; }
        }

        header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .header-title h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
        .header-title p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 20px;
            border: 1px solid var(--border);
            height: fit-content;
            width: 100%;
        }
        
        .card-header { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 1.125rem; font-weight: 600; }

        .form-group { margin-bottom: 16px; position: relative; }
        label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-main); margin-bottom: 6px; }
        
        input, select, textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 16px; color: var(--text-main); background: #fff; appearance: none; font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }

        textarea { 
            resize: vertical; 
            min-height: 80px; /* Made taller to ensure visibility */
            background-color: #fff;
        }

        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "▼"; font-size: 0.7rem; color: var(--text-muted);
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none;
        }

        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); z-index: 10; }
        input[readonly] { background-color: #f8fafc; color: var(--text-muted); border-color: transparent; cursor: default; font-weight: 600; }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-secondary { background: #e2e8f0; color: var(--text-main); margin-top: 8px; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2); }
        .btn-primary:hover { box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3); transform: translateY(-1px); }

        /* Sticky Footer */
        .mobile-sticky-footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 12px 15px; border-top: 1px solid var(--border);
            z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); display: block;
        }
        @media (min-width: 769px) { .mobile-sticky-footer { display: none; } .desktop-submit-btn { display: flex; } }
        @media (max-width: 768px) { .desktop-submit-btn { display: none; } }

        /* Cart Preview */
        .cart-preview { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; margin-top: 15px; display: none; }
        .cart-preview.active { display: block; }
        .cart-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px dashed #e2e8f0; }
        .cart-item:last-child { border-bottom: none; }
        .cart-count-badge { background: var(--primary); color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.75rem; margin-left: 5px; }

        /* Autocomplete */
        .autocomplete-items { position: absolute; z-index: 10000; top: 100%; left: 0; right: 0; background: #fff; max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 0 0 var(--radius-sm) var(--radius-sm); box-shadow: var(--shadow-md); margin-top: 4px; }
        .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
        .autocomplete-items div:hover { background-color: #f8fafc; }
        .autocomplete-items div strong { color: var(--primary); }

        /* Status Dropdown */
        .status-dropdown { position: relative; width: 100%; min-width: 140px; }
        .status-btn { width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: white; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; white-space: nowrap; }
        .status-btn:hover { border-color: var(--primary); }
        .status-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .status-menu { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow-md); z-index: 2000; margin-top: 4px; display: none; overflow: hidden; }
        .status-menu.show { display: block; animation: slideDown 0.15s ease; }
        .status-option { padding: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.85rem; color: var(--text-main); border-bottom: 1px solid #f1f5f9; transition: background 0.1s; white-space: nowrap; }
        .status-option:last-child { border-bottom: none; }
        .status-option:hover { background: #f8fafc; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* Table Styles */
        .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 700px; }
        thead { background-color: #f8fafc; position: sticky; top: 0; z-index: 10; }
        th { text-align: left; padding: 12px 16px; font-weight: 600; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #fdfdfd; }

        .item-list { display: flex; flex-direction: column; gap: 4px; min-width: 200px; }
        .mini-item { background: #f1f5f9; padding: 6px 8px; border-radius: 4px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; white-space: normal; }
        .mini-item-code { font-weight: 600; color: var(--primary); }
        .mini-item-meta { color: var(--text-muted); font-size: 0.75rem; }

        @media screen and (max-width: 768px) {
            th, td { padding: 10px 12px; }
            .status-menu { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; border-radius: 12px 12px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); animation: slideUp 0.2s ease; max-height: 50vh; overflow-y: auto; }
            @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
            .action-cell { display: flex; gap: 6px; }
            .icon-btn { padding: 6px 10px; font-size: 0.75rem; white-space: nowrap; }
        }

        /* Toast */
        #toast-container { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 20000; pointer-events: none; }
        @media (min-width: 769px) { #toast-container { bottom: 20px; } }
        .toast { background: rgba(15, 23, 42, 0.95); color: white; padding: 14px 20px; border-radius: 8px; margin-top: 10px; box-shadow: var(--shadow-md); opacity: 0; transform: translateY(20px); transition: all 0.3s; display: flex; align-items: center; gap: 10px; pointer-events: auto; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        /* Spinner */
        .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Product Image Preview (Feature 1) --- */
        .product-image-preview {
            display: flex; align-items: center; gap: 12px;
            margin-top: 4px; margin-bottom: 16px;
        }
        .product-image-preview.hidden { display: none; }
        .product-image-box {
            width: 150px; height: 150px; flex-shrink: 0;
            border-radius: var(--radius-sm); border: 1px solid var(--border);
            box-shadow: var(--shadow-sm); background: #f8fafc;
            overflow: hidden; cursor: pointer; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .product-image-box img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
        .product-image-box .img-loading-dot {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid var(--border); border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }
        .product-image-meta { font-size: 0.75rem; color: var(--text-muted); }

        /* --- History Table Thumbnails (Feature 3) --- */
        .history-thumb-wrap {
            width: 70px; height: 70px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: #f8fafc; margin: 0 auto; cursor: pointer;
            position: relative;
        }
        .history-thumb-wrap img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
        .history-thumb-placeholder {
            font-size: 0.6rem; color: var(--text-muted); text-align: center;
            line-height: 1.2; padding: 4px;
        }
        .history-thumb-stack { display: flex; align-items: center; justify-content: center; gap: 2px; }
        .history-thumb-stack .history-thumb-wrap { width: 44px; height: 44px; margin: 0; }
        .history-thumb-more { font-size: 0.7rem; color: var(--text-muted); margin-left: 2px; }
        .thumb-skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        /* --- Product Preview Modal (reused from Single SKU Search) --- */
        .pv-modal-overlay {
            position: fixed; inset: 0; z-index: 30000;
            background: rgba(15, 23, 42, 0.55);
            display: flex; align-items: center; justify-content: center; padding: 20px;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .pv-modal-overlay.open { opacity: 1; pointer-events: auto; }
        .pv-modal {
            background: #fff; border-radius: 16px; max-width: 640px; width: 100%;
            max-height: 88vh; display: grid; grid-template-columns: 1fr 1fr;
            overflow: hidden; position: relative; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4);
            transform: translateY(10px) scale(0.97); transition: transform 0.2s ease;
        }
        .pv-modal-overlay.open .pv-modal { transform: translateY(0) scale(1); }
        @media (max-width: 620px) { .pv-modal { grid-template-columns: 1fr; max-height: 92vh; } }
        .pv-modal-close {
            position: absolute; top: 10px; right: 10px; width: 32px; height: 32px;
            border-radius: 50%; border: none; background: rgba(255,255,255,0.92);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: var(--shadow-sm); z-index: 5; color: var(--text-main);
        }
        .pv-modal-media { background: #f1f5f9; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 220px; }
        .pv-modal-media img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
        .pv-modal-info { padding: 22px; overflow-y: auto; display: flex; flex-direction: column; }
        .pv-modal-sku { display: inline-block; background: #eff6ff; color: var(--primary-dark); font-weight: 600; font-size: 0.8rem; padding: 5px 10px; border-radius: 6px; align-self: flex-start; margin-bottom: 10px; }
        .pv-modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .pv-modal-price { font-weight: 700; color: var(--warning); font-size: 1.15rem; margin-bottom: 14px; }
        .pv-modal-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }
        .pv-modal-desc p { margin-bottom: 10px; }

        /* Print */
        #print-container { display: none; }
        @media print {
            body > * { display: none !important; }
            #print-container { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; font-family: monospace; font-size: 16px; color: black; background: white; }
            .print-header { text-align: center; font-weight: bold; font-size: 20px; margin-bottom: 20px; border-bottom: 2px solid black; padding-bottom: 10px; }
            .print-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
            .print-label { font-weight: bold; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Booking Portal</h1>
            <p>Multi-Item Grouped System</p>
        </div>
    </header>

    <div class="container">
        
        <!-- Booking Form -->
        <aside class="card">
            <div class="card-header">
                <span class="card-title">New Booking</span>
            </div>
            
            <form id="bookingForm" novalidate>
                <!-- Customer Details -->
                <div style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--border);">
                    <div style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 10px;">Customer</div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="customerName" placeholder="Name" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="phone" placeholder="017..." required inputmode="tel">
                    </div>
                    <!-- NOTE FIELD -->
                    <div class="form-group">
                        <label>Booking Note (Optional)</label>
                        <textarea id="bookingNote" placeholder="Type any specific instructions here..."></textarea>
                    </div>
                </div>

                <!-- Product Details -->
                <div style="margin-bottom: 20px;">
                    <div style="font-size: 0.8rem; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 10px;">Product</div>
                    
                    <div class="form-group">
                        <label>Style Code</label>
                        <input type="text" id="styleCode" placeholder="Search code..." autocomplete="off" required>
                        <div id="styleCodeList" class="autocomplete-items"></div>
                    </div>

                    <!-- Feature 1: Product image preview, shown after a Style Code is selected -->
                    <div id="productImagePreview" class="product-image-preview hidden">
                        <div class="product-image-box" id="productImageBox" onclick="openStyleImagePreview()">
                            <div class="img-loading-dot"></div>
                        </div>
                        <div class="product-image-meta">Tap image to preview</div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <div class="select-wrapper"><label>Size</label><select id="size" required disabled><option value="">Select</option></select></div>
                        </div>
                        <div class="form-group">
                            <div class="select-wrapper"><label>Color</label><select id="color" required disabled><option value="">Select</option></select></div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label>Price</label>
                            <input type="number" id="price" readonly>
                        </div>
                        <div class="form-group">
                            <div class="select-wrapper"><label>Branch</label>
                                <select id="reqFrom" required>
                                    <option value="">Select</option>
                                    <option value="JFP">JFP</option>
                                    <option value="BANANI">BANANI</option>
                                    <option value="KHULNA">KHULNA</option>
                                    <option value="TANGAIL">TANGAIL</option>
                                    <option value="PMC">PMC</option>
                                    <option value="WARI">WARI</option>
                                    <option value="BOOKING FOR CUSTOMER">BOOKING FOR CUSTOMER</option>
                                    <option value="ALTERATION BOOKING">ALTERATION BOOKING</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cart Preview -->
                <div id="cartPreview" class="cart-preview">
                    <div style="font-size: 0.8rem; font-weight: 600; margin-bottom: 5px;">
                        Items in List: <span id="cartCount" class="cart-count-badge">0</span>
                    </div>
                    <div id="cartList"></div>
                    <button type="button" onclick="clearCart()" style="background:none; border:none; color:var(--danger); font-size:0.8rem; cursor:pointer; margin-top:5px; text-decoration:underline;">Clear List</button>
                </div>

                <!-- Buttons -->
                <button type="button" class="btn btn-secondary" onclick="addToCart()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Another Item
                </button>

                <div class="form-group" style="margin-top: 15px;">
                    <div class="select-wrapper">
                        <label>Status</label>
                        <select id="status" required>
                            <option value="Requirement Done">Requirement Done</option>
                            <option value="On Hand">On Hand</option>
                            <option value="Booking">Booking</option>
                            <option value="Alteration">Alteration</option>
                            <option value="Hold For Customer">Hold For Customer</option>
                            <option value="Bill Done">Bill Done</option>
                            <option value="Calling Customer Done ">Calling Customer Done</option>
                            
                        </select>
                    </div>
                </div>

                <!-- Desktop Submit Button -->
                <button type="submit" class="btn btn-primary desktop-submit-btn" id="submitBtnDesktop">
                    <span>Confirm Booking</span>
                    <div class="spinner" id="btnSpinnerDesktop"></div>
                </button>
            </form>
        </aside>

        <!-- Booking History -->
        <main class="card">
            <div class="card-header">
                <span class="card-title">History</span>
                <button onclick="loadBookings()" style="border:none; background:none; cursor:pointer; color:var(--primary);">Refresh ↻</button>
            </div>
            
            <div class="search-container" style="position: relative; margin-bottom: 15px;">
                <input type="text" id="searchInput" placeholder="Search..." style="padding-left: 35px; border-radius: 20px;">
                <svg style="position: absolute; left: 12px; top: 13px; color: #94a3b8;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>

            <!-- SCROLLABLE TABLE WRAPPER -->
            <div class="table-wrapper">
                <table id="bookingsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Customer</th>
                            <th style="width: 40%;">Products</th>
                            <th>Branches</th>
                            <th>Status</th>
                            <th>Image</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- STICKY MOBILE FOOTER -->
    <div class="mobile-sticky-footer">
        <button type="submit" form="bookingForm" class="btn btn-primary" id="submitBtnMobile">
            <span>Confirm Booking</span>
            <div class="spinner" id="btnSpinnerMobile"></div>
        </button>
    </div>

    <!-- Product Preview Modal (reused component, same as Single SKU Search) -->
    <div class="pv-modal-overlay" id="pvModalOverlay">
        <div class="pv-modal" role="dialog" aria-modal="true">
            <button class="pv-modal-close" id="pvModalClose" type="button" aria-label="Close">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="pv-modal-media">
                <img id="pvModalImg" src="" alt="">
            </div>
            <div class="pv-modal-info">
                <span class="pv-modal-sku" id="pvModalSku"></span>
                <div class="pv-modal-title" id="pvModalTitle"></div>
                <div class="pv-modal-price" id="pvModalPrice"></div>
                <div class="pv-modal-desc" id="pvModalDesc"></div>
            </div>
        </div>
    </div>

    <div id="print-container"></div>
    <div id="toast-container"></div>

    <script>
        // --- CONFIG ---
        const SUPABASE_URL = "https://vrsdpyodfejjuihutgag.supabase.co";

        // ==========================================================================
        const IMG_BASE_URL = "https://blucheez.fashion/products.json";
        const PLACEHOLDER_IMG = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23ECEAE3'/%3E%3Cpath d='M60 130 L90 95 L115 120 L135 90 L150 130 Z' fill='%23D9D6CB'/%3E%3Ccircle cx='75' cy='75' r='10' fill='%23D9D6CB'/%3E%3C/svg%3E";

        // Same URL-normalizing helper as the Single SKU Search: strips Shopify's
        // resize/crop query params and filename size suffixes so the full,
        // original photo is always used instead of a cropped thumbnail.
        function getFullResolutionImageUrl(url) {
            if (!url) return url;
            try {
                const u = new URL(url, window.location.origin);
                ['width', 'height', 'crop', 'format'].forEach(p => u.searchParams.delete(p));
                const sizeSuffix = /_(pico|icon|thumb|small|compact|medium|large|grande|original|master|\d+x\d*)(?=\.[a-zA-Z]+$)/i;
                u.pathname = u.pathname.replace(sizeSuffix, '');
                return u.toString();
            } catch (e) { return url; }
        }

        // Same gallery-image picker as the Single SKU Search: filters out
        // swatch-icon entries and de-duplicates.
        function pickGalleryImages(product) {
            const images = (product.images && product.images.length > 0) ? product.images : [];
            const out = []; const seen = {};
            images.forEach(imgObj => {
                const alt = (imgObj.alt || '').toLowerCase();
                if (alt.indexOf('swatch') !== -1) return;
                const url = getFullResolutionImageUrl(imgObj.src);
                if (!url || seen[url]) return;
                seen[url] = true;
                out.push(url);
            });
            return out;
        }

        function transformImageProduct(product) {
            const galleryImages = pickGalleryImages(product);
            const image = galleryImages.length > 0 ? galleryImages[0] : '';
            const variant = (product.variants && product.variants.length > 0) ? product.variants[0] : null;
            const sku = (variant && variant.sku) ? String(variant.sku).trim() : '';
            const price = (variant && variant.price) ? variant.price : '0.00';
            let description = '';
            if (product.body_html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = product.body_html.replace(/<\/(p|div|li|h[1-6])>/gi, '\n').replace(/<br\s*\/?>/gi, '\n');
                description = (tmp.textContent || tmp.innerText || '').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
            }
            return { title: product.title || '', image, images: galleryImages, sku, price, description };
        }

        // Same pagination loop as the Single SKU Search's loadProducts(). Runs
        // once in the background; every style-code image lookup afterwards is

        let imageCatalog = [];
        let imageCatalogLoading = null;
        function ensureImageCatalogLoaded() {
            if (imageCatalog.length > 0) return Promise.resolve(imageCatalog);
            if (imageCatalogLoading) return imageCatalogLoading;
            imageCatalogLoading = (async () => {
                let page = 1; const MAX_PAGES = 200; let combined = [];
                try {
                    while (page <= MAX_PAGES) {
                        const res = await fetch(IMG_BASE_URL + '?limit=250&page=' + page);
                        if (!res.ok) { if (page === 1) throw new Error('status ' + res.status); break; }
                        const data = await res.json();
                        const products = (data && data.products) ? data.products : [];
                        if (products.length === 0) break;
                        combined = combined.concat(products);
                        page++;
                    }
                    imageCatalog = combined.map(transformImageProduct).filter(p => p.sku && p.sku.length > 0);
                } catch (e) { console.error('Image catalog load failed', e); imageCatalog = []; }
                return imageCatalog;
            })();
            return imageCatalogLoading;
        }

            for (let i = 0; i < imageCatalog.length; i++) if (imageCatalog[i].sku.toLowerCase() === q) return imageCatalog[i];
            for (let j = 0; j < imageCatalog.length; j++) if (imageCatalog[j].sku.toLowerCase().indexOf(q) !== -1) return imageCatalog[j];
            return null;
        }

        // Escapes text for safe inline use inside onclick="" attribute strings.
        function escAttr(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
        }

        // Retry-once + placeholder fallback for history thumbnails — kept as a
        // real function (not an inline string) so the placeholder data URI's
        // own quote characters can never break generated HTML.
        function historyThumbImgError(imgEl) {
            if (!imgEl.dataset.retried && imgEl.dataset.original) {
                imgEl.dataset.retried = '1';
                const orig = imgEl.dataset.original;
                imgEl.src = orig + (orig.indexOf('?') === -1 ? '?retry=1' : '&retry=1');
            } else {
                imgEl.src = PLACEHOLDER_IMG;
            }
        }

        // Builds an (initially empty/skeleton) thumbnail wrapper for one item.
        // The actual image is filled in afterwards by hydrateHistoryThumbnails()
        // once it has been fetched via the SAME image lookup function used by
        // the booking form and cached by Style Code.
        function buildHistoryThumbHtml(item, sizeClass) {
            const code = item.style_code || '';
            return `
                <div class="history-thumb-wrap thumb-skeleton ${sizeClass || ''}" data-style-code="${escAttr(code)}" onclick="openHistoryImagePreviewByCode('${escAttr(code)}')">
                </div>`;
        }

        // Fills in a thumbnail wrapper once its Style Code's image has resolved
        // (found or not found), with retry-once + "No Image Available" fallback.
        function renderHistoryThumbImage(wrap, product, code) {
            wrap.classList.remove('thumb-skeleton');
            wrap.innerHTML = '';
            if (product && product.image) {
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.alt = code || '';
                img.dataset.original = product.image;
                img.onerror = () => historyThumbImgError(img);
                img.src = product.image;
                wrap.appendChild(img);
            } else {
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.alt = 'No Image Available';
                img.src = PLACEHOLDER_IMG;
                wrap.appendChild(img);
            }
        }

        // ISSUE 1 fix: automatically loads every visible row's product image
        // as soon as the History table is (re)rendered — no click needed.
        // Reuses getImageProductForStyle() (same catalog + cache used by the
        // booking form's own image preview), so a Style Code already looked up
        // anywhere in the app is never fetched twice.
        async function hydrateHistoryThumbnails(tbody) {
            const wraps = Array.from(tbody.querySelectorAll('.history-thumb-wrap[data-style-code]'));
            if (!wraps.length) return;
            const uniqueCodes = [...new Set(wraps.map(w => w.dataset.styleCode).filter(Boolean))];
            await Promise.all(uniqueCodes.map(code => getImageProductForStyle(code)));
            wraps.forEach(wrap => {
                const code = wrap.dataset.styleCode;
                const product = code ? styleImageCache[code.toLowerCase()] : null;
                renderHistoryThumbImage(wrap, product, code);
            });
        }

        function openHistoryImagePreviewByCode(code) {
            const product = code ? styleImageCache[code.toLowerCase()] : null;
            openProductPreviewModal(product || null, code);
        }

        // Chooses single-thumbnail vs. stacked-thumbnails layout for a booking
        // group's Image column, whichever gives the cleaner UI as requested.
        function buildHistoryImageCellHtml(items) {
            if (!items.length) return `<div class="history-thumb-wrap"><img src="${PLACEHOLDER_IMG}" alt="No Image Available"></div>`;
            if (items.length === 1) return buildHistoryThumbHtml(items[0]);

            const STACK_LIMIT = 3;
            const shown = items.slice(0, STACK_LIMIT);
            let html = '<div class="history-thumb-stack">';
            shown.forEach(i => { html += buildHistoryThumbHtml(i, 'stacked'); });
            if (items.length > STACK_LIMIT) html += `<span class="history-thumb-more">+${items.length - STACK_LIMIT}</span>`;
            html += '</div>';
            return html;
        }

        function renderGroupedBookings(data) {
            const tbody = document.getElementById('bookingsBody');
            tbody.innerHTML = '';

            if(!data.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#94a3b8">No bookings</td></tr>'; return; }

            const groups = {};
            data.forEach(b => {
                const key = `${b.booking_date}_${b.customer_name}_${b.phone}`;
                if(!groups[key]) groups[key] = { main: b, items: [], allIds: [] };
                groups[key].items.push(b);
                groups[key].allIds.push(b.id);
            });

            Object.values(groups).forEach(group => {
                const tr = document.createElement('tr');
                const main = group.main;
                const items = group.items;
                const ids = group.allIds;

                // Items HTML
                let itemsHtml = '<div class="item-list">';
                items.forEach(i => {
                    itemsHtml += `
                        <div class="mini-item">
                            <span class="mini-item-code">${i.style_code}</span>
                            <span class="mini-item-meta">${i.size} / ${i.color} / BDT ${i.price}</span>
                        </div>`;
                });
                itemsHtml += '</div>';

                // Branch Logic
                let branchDisplay = items[0].requirement_from;
                if(items.length > 1) {
                    const uniqueBranches = [...new Set(items.map(i => i.requirement_from))];
                    branchDisplay = uniqueBranches.join(', ');
                }

                // Note Logic
                const noteHtml = main.note ? `<div style="font-style:italic; color:#64748b; font-size:0.8rem; margin-top:6px; background:#f8fafc; padding:6px; border-radius:4px; border-left: 3px solid var(--primary);">Note: ${main.note}</div>` : '';

                // Status Dropdown
                const currentStatus = main.status;
                const config = STATUS_CONFIG[currentStatus] || STATUS_CONFIG["Requirement Done"];
                const menuId = `menu-${ids[0]}`;
                const idsJson = JSON.stringify(ids);

                let statusHtml = `
                    <div class="status-dropdown">
                        <div class="status-btn" onclick="toggleDropdown('${menuId}')">
                            <div class="status-left">
                                <div class="status-dot" style="background-color: ${config.color}"></div>
                                <span>${config.label}</span>
                            </div>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div id="${menuId}" class="status-menu">
                `;

                Object.values(STATUS_CONFIG).forEach(opt => {
                    statusHtml += `
                        <div class="status-option" onclick="updateGroupStatus(${idsJson}, '${opt.label}')">
                            <div style="color: ${opt.color}; display:flex; align-items:center; gap:8px;">
                                ${opt.icon}
                            </div>
                            <span>${opt.label}</span>
                        </div>
                    `;
                });

                statusHtml += `</div></div>`;

                // Image column (Feature 3): show up to 3 stacked thumbnails when
                // there are multiple products, otherwise a single 70x70 thumb.
                const imageItemsHtml = buildHistoryImageCellHtml(items);

                tr.innerHTML = `
                    <td><div style="font-weight:600;">${main.booking_date}</div></td>
                    <td>
                        <div style="font-weight:600;">${main.customer_name}</div>
                        <div style="font-size:0.8em; color:#64748b;">${main.phone}</div>
                        ${noteHtml}
                    </td>
                    <td>${itemsHtml}</td>
                    <td style="font-size:0.85rem;">${branchDisplay}</td>
                    <td>${statusHtml}</td>
                    <td>${imageItemsHtml}</td>
                    <td>
                        <div class="action-cell">
                            <button class="icon-btn" style="border:1px solid #e2e8f0; background:white; padding:6px 10px; border-radius:6px; font-size:0.8rem; display:flex; align-items:center; gap:5px; cursor:pointer;" onclick="copyBookingGroup('${main.booking_date}', '${main.customer_name}', '${main.phone}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                Copy
                            </button>
                            <button class="icon-btn" style="border:1px solid #e2e8f0; background:white; padding:6px 10px; border-radius:6px; font-size:0.8rem; display:flex; align-items:center; gap:5px; cursor:pointer;" onclick="printGroup('${main.booking_date}', '${main.customer_name}', '${main.phone}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                                Print
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // ISSUE 1 fix: load every row's product image automatically, no
            // click required. Runs after every render (initial load, refresh,
            // and search filtering) so images always reflect what's on screen.
            hydrateHistoryThumbnails(tbody);
        }

        // --- ACTIONS ---
        async function updateGroupStatus(ids, newStatus) {
            try {
                const { error } = await sbClient.from('bookings').update({ status: newStatus }).in('id', ids);
                if(error) throw error;
                showToast("Status updated", "success");
                document.querySelectorAll('.status-menu').forEach(el => el.classList.remove('show'));
                loadBookings();
            } catch(err) { showToast("Error", "error"); }
        }

        // WhatsApp Desktop/Web's paste handler doesn't render text/html (no
        // inline <img> support) — it only recognizes real image bytes on the
        // clipboard. Chrome's Clipboard API only accepts 'image/png' for image
        // writes, so any fetched product photo (jpg/webp/etc.) is redrawn onto
        // a canvas and re-encoded as PNG here. Returns null if the image can't
        // be fetched or the canvas gets tainted (e.g. a CORS-blocked host) so
        // callers can fall back gracefully instead of failing the whole copy.
        async function imageUrlToPngBlob(url) {
            if (!url) return null;
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                const blob = await res.blob();
                const objectUrl = URL.createObjectURL(blob);
                try {
                    const img = await new Promise((resolve, reject) => {
                        const im = new Image();
                        im.onload = () => resolve(im);
                        im.onerror = reject;
                        im.src = objectUrl;
                    });
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || 1;
                    canvas.height = img.naturalHeight || 1;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    return await new Promise(resolve => canvas.toBlob(b => resolve(b), 'image/png'));
                } finally {
                    URL.revokeObjectURL(objectUrl);
                }
            } catch (e) {
                console.warn('Could not convert product image to clipboard-ready PNG (fetch or CORS issue):', e);
                return null;
            }
        }

        // Reads a Blob into a base64 data: URL without re-fetching it — used so
        // the exact same image bytes fetched once (imageUrlToPngBlob) can also
        // be embedded inline in the HTML payload.
        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // Feature 4 / Issue 2: Copy Booking With Image — writes image/png,
        // text/html, and text/plain together in a SINGLE ClipboardItem via a
        // SINGLE clipboard.write() call, so the image and booking details are
        // copied together instead of one overwriting the other. The
        // booking-details TEXT FORMAT is exactly the original format
        // (unchanged); the image is fetched once and reused for both the raw
        // image/png entry (for apps like WhatsApp that only read image bytes)
        // and the inline <img> in the HTML entry (for apps like Word/Docs/
        // Outlook/Gmail that read text/html).
        async function copyBookingGroup(date, name, phone) {
            const group = bookingDataCache.filter(b => b.booking_date === date && b.customer_name === name && b.phone === phone);

            // --- Plain text: exactly the original format, unchanged ---
            let text = `DATE: ${date}\nNAME: ${name}\nPHONE: ${phone}\n`;
            text += `\nITEMS:\n`;
            group.forEach(i => { text += `- ${i.style_code} | ${i.size} | ${i.color} | BDT ${i.price} | Branch: ${i.requirement_from}\n`; });

            const escHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

            // Reuse the already-fetched product image (same cached lookup used
            // by the booking form and History thumbnails) — no re-fetch here.
            // Only the first item's image is needed since just one image is
            // placed above the details.
            let productImageUrl = '';
            for (const i of group) {
                const product = await getImageProductForStyle(i.style_code);
                productImageUrl = (product && product.image) ? product.image : (i.image_url || '');
                if (productImageUrl) break;
            }

            // Fetch the image ONCE as a PNG Blob (existing, working logic —
            // unchanged), then derive the data URL for the HTML entry from
            // that SAME blob (no second fetch).
            const pngBlob = productImageUrl ? await imageUrlToPngBlob(productImageUrl) : null;
            const imageDataUrl = pngBlob ? await blobToDataUrl(pngBlob) : null;

            const imageHtmlBlock = imageDataUrl
                ? `<img src="${imageDataUrl}" width="140" alt="Product">`
                : `<p>No Image Available</p>`;

            // --- HTML: product image, then the SAME booking details format,
            // preserved verbatim inside a <pre> block (no table, no extra labels).
            const html = `${imageHtmlBlock}<pre>${escHtml(text)}</pre>`;

            const canUseClipboardItems = !!(navigator.clipboard && window.ClipboardItem);

            if (canUseClipboardItems) {
                // Build ONE ClipboardItem with all three representations
                // together — image/png, text/html, and text/plain all live in
                // the same clipboard write, so no format overwrites another.
                const items = {
                    'text/plain': new Blob([text], { type: 'text/plain' }),
                    'text/html': new Blob([html], { type: 'text/html' })
                };
                if (pngBlob) items['image/png'] = pngBlob;

                console.log('Writing ClipboardItem with formats:', Object.keys(items));

                try {
                    const clipboardItem = new ClipboardItem(items);
                    console.log('ClipboardItem types:', clipboardItem.types);
                    await navigator.clipboard.write([clipboardItem]);
                    showToast(pngBlob ? "Copied — image & details" : "Copied — details (image unavailable)", "success");
                    return;
                } catch (e) {
                    console.warn('Clipboard write attempt failed:', e);
                }
            }

            // Last resort: plain text only.
            try {
                await navigator.clipboard.writeText(text);
                showToast("Copied (text only)", "success");
            } catch (err2) {
                console.error(err2);
                showToast("Failed", "error");
            }
        }

        function printGroup(date, name, phone) {
            const group = bookingDataCache.filter(b => b.booking_date === date && b.customer_name === name && b.phone === phone);
            let itemsHtml = '';
            let noteHtml = '';

            group.forEach(i => {
                itemsHtml += `<div style="border-bottom:1px dashed #ccc; padding:5px 0;">${i.style_code} - ${i.size} - ${i.color} (BDT ${i.price}) <br> <small>Branch: ${i.requirement_from}</small></div>`;
            });
            
            if(group[0] && group[0].note) {
                noteHtml = `<div style="margin-bottom:10px; padding:8px; background:#f4f4f4; border:1px solid #ccc; font-size:0.9em;"><strong>Note:</strong> ${group[0].note}</div>`;
            }

            const html = `
                <div class="print-header">BOOKING SLIP</div>
                <div class="print-row"><span class="print-label">DATE:</span> <span>${date}</span></div>
                <div class="print-row"><span class="print-label">NAME:</span> <span>${name}</span></div>
                <div class="print-row"><span class="print-label">PHONE:</span> <span>${phone}</span></div>
                <hr style="margin:10px 0;">
                ${noteHtml}
                <div style="margin-bottom:10px;"><strong>ITEMS:</strong></div>
                ${itemsHtml}
            `;
            document.getElementById('print-container').innerHTML = html;
            window.print();
        }

        function showToast(msg, type='success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.innerHTML = `<span>${type==='success'?'✓':'✕'}</span> ${msg}`;
            c.appendChild(t);
            setTimeout(()=>t.classList.add('show'), 10);
            setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 3000);
        }

        window.addEventListener('DOMContentLoaded', loadBookings);
    </script>
</body>
