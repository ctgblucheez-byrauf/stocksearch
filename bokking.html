<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking System | Modern UI</title>
    <!-- Google Fonts: Inter for a clean, professional look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root {
            /* Color Palette */
            --primary: #3b82f6; /* Blue 500 */
            --primary-dark: #2563eb; /* Blue 600 */
            --bg-body: #f8fafc; /* Slate 50 */
            --bg-card: #ffffff;
            --text-main: #0f172a; /* Slate 900 */
            --text-muted: #64748b; /* Slate 500 */
            --border: #e2e8f0; /* Slate 200 */
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            
            /* Spacing & Radius */
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
        }

        /* Layout */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 380px 1fr; /* Sidebar width optimized */
            }
        }

        /* Header */
        header {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
        .header-title p { color: var(--text-muted); font-size: 0.9rem; }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 24px;
            border: 1px solid var(--border);
            height: fit-content;
            transition: box-shadow 0.3s ease;
        }
        
        .card-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title { font-size: 1.125rem; font-weight: 600; color: var(--text-main); }

        /* Form Elements */
        .form-group { margin-bottom: 16px; position: relative; }
        
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="date"], input[type="tel"], input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #fff;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Readonly fields */
        input[readonly] {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border-color: transparent;
            cursor: default;
            font-weight: 500;
        }

        /* Button */
        button.btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.btn-primary:hover {
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transform: translateY(-1px);
        }
        
        button.btn-primary:active { transform: translateY(0); }

        /* Autocomplete */
        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--border);
            z-index: 100;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #fff;
            max-height: 220px;
            overflow-y: auto;
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            box-shadow: var(--shadow-lg);
            margin-top: 4px;
        }
        .autocomplete-items div {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .autocomplete-items div:hover { background-color: #f8fafc; }
        .autocomplete-items div strong { color: var(--primary); }

        /* Search Bar */
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }
        .search-container input {
            padding-left: 40px; /* Space for icon */
            border-radius: 50px; /* Pill shape */
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            max-height: 600px; /* Fixed height for inner scroll */
            overflow-y: auto;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 700px; }
        
        thead {
            background-color: #f8fafc;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #fdfdfd; }

        /* Status Select in Table */
        .status-select {
            padding: 6px 10px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: white;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
            transition: border-color 0.2s;
        }
        .status-select:hover { border-color: var(--primary); }

        /* Toast */
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; }
        .toast {
            background: rgba(15, 23, 42, 0.9); /* Dark glass */
            backdrop-filter: blur(8px);
            color: white; 
            padding: 14px 20px; 
            border-radius: 8px;
            margin-top: 10px; 
            box-shadow: var(--shadow-lg);
            opacity: 0; 
            transform: translateY(20px); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            min-width: 250px;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        /* Spinner */
        .spinner {
            display: none; 
            width: 18px; 
            height: 18px; 
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #ffffff; 
            border-radius: 50%;
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Utility classes for table text */
        .text-sm { font-size: 0.85em; color: var(--text-muted); display: block; margin-top: 2px; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;
            background: #e2e8f0; color: #475569;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Booking Portal</h1>
            <p>Inter-branch requisition management</p>
        </div>
        <div class="user-profile">
            <!-- Placeholder for user avatar or settings -->
            <div style="width: 40px; height: 40px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #64748b; font-weight: bold;">AD</div>
        </div>
    </header>

    <div class="container">
        
        <!-- Sidebar: New Booking -->
        <aside class="card">
            <div class="card-header">
                <span class="card-title">New Booking</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </div>
            
            <form id="bookingForm">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="customerName" name="customerName" placeholder="e.g. Rahim Ahmed" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="017..." required>
                </div>

                <div class="form-group">
                    <label>Style Code</label>
                    <input type="text" id="styleCode" name="styleCode" placeholder="Search code..." autocomplete="off" required>
                    <div id="styleCodeList" class="autocomplete-items"></div>
                </div>

                <div class="form-group">
                    <label>Size</label>
                    <select id="size" name="size" required>
                        <option value="">Select Size</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>
                        <option value="XXXL">XXXL</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Available Color</label>
                    <select id="color" name="color" required disabled>
                        <option value="">Select Style & Size</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Price (BDT)</label>
                    <input type="number" id="price" name="price" readonly placeholder="Auto-calculated">
                </div>

                <div class="form-group">
                    <label>Requirement From</label>
                    <select id="reqFrom" name="reqFrom" required>
                        <option value="">Select Branch</option>
                        <option value="JFP">JFP</option>
                        <option value="BANANI">BANANI</option>
                        <option value="KHULNA">KHULNA</option>
                        <option value="TANGAIL">TANGAIL</option>
                        <option value="PMC">PMC</option>
                        <option value="WARI">WARI</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Initial Status</label>
                    <select id="status" name="status" required>
                        <option value="Requirement Done">Requirement Done</option>
                        <option value="On Hand">On Hand</option>
                        <option value="Calling Customer Done">Calling Customer Done</option>
                        <option value="Customer Bill Done">Customer Bill Done</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span>Confirm Booking</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </form>
        </aside>

        <!-- Main Content: Search & List -->
        <main class="card">
            <div class="card-header">
                <span class="card-title">Booking History</span>
                <button onclick="searchBookings()" style="border:none; background:none; cursor:pointer; color:var(--primary); font-size:0.9rem; font-weight:500;">Refresh ↻</button>
            </div>
            
            <div class="search-container">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Search by name, phone, or style code...">
            </div>

            <div class="table-wrapper">
                <table id="bookingsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Customer Info</th>
                            <th>Product Details</th>
                            <th>Branch</th>
                            <th style="min-width: 180px;">Status</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody">
                        <tr><td colspan="5" style="text-align:center; padding: 40px; color:var(--text-muted);">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        // --- 1. CONFIGURATION & SAFE INITIALIZATION ---
        const SUPABASE_URL = "https://vrsdpyodfejjuihutgag.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc2RweW9kZmVqanVpaHV0Z2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDU1MjAsImV4cCI6MjA4MzI4MTUyMH0.lHEpLJDfeHBRWElnW11wggWr59yXSgRAff3n1ZFTeDE";
        
        let sbClient;
        try {
            if (window.supabase) {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                showToast("Connection failed. Check internet.", "error");
            }
        } catch (e) {
            console.error(e);
            showToast("System error.", "error");
        }

        // --- 2. DOM ELEMENTS ---
        const form = document.getElementById('bookingForm');
        const styleCodeInput = document.getElementById('styleCode');
        const styleCodeList = document.getElementById('styleCodeList');
        const sizeSelect = document.getElementById('size');
        const colorSelect = document.getElementById('color');
        const priceInput = document.getElementById('price');
        const dateInput = document.getElementById('date');
        const searchInput = document.getElementById('searchInput');
        const bookingsBody = document.getElementById('bookingsBody');

        // Set today's date
        dateInput.valueAsDate = new Date();

        let currentStyleCode = null;
        let searchTimeout = null;

        const statusOptions = [
            "Requirement Done", 
            "On Hand", 
            "Calling Customer Done", 
            "Customer Bill Done"
        ];

        // --- 3. AUTOCOMPLETE & FETCH LOGIC ---

        styleCodeInput.addEventListener('input', function(e) {
            const val = this.value;
            closeAllLists();
            if (!val || val.length < 2) return false;

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => fetchStyleSuggestions(val), 300);
        });

        document.addEventListener('click', function(e) {
            if (e.target !== styleCodeInput) closeAllLists();
        });

        sizeSelect.addEventListener('change', function() {
            if(currentStyleCode) fetchColorsAndPrice(currentStyleCode, this.value);
        });

        async function fetchStyleSuggestions(query) {
            try {
                const { data, error } = await sbClient
                    .from('inventory')
                    .select('style_code, name, mrp')
                    .or(`style_code.ilike.%${query}%,name.ilike.%${query}%`)
                    .limit(10);

                if (error) throw error;
                styleCodeList.innerHTML = '';
                
                if (!data || data.length === 0) {
                    const noResult = document.createElement("div");
                    noResult.innerText = "No matches found";
                    noResult.style.color = "var(--text-muted)";
                    styleCodeList.appendChild(noResult);
                    return;
                }

                data.forEach(item => {
                    const itemDiv = document.createElement("div");
                    itemDiv.innerHTML = `<strong>${item.style_code}</strong> <span style="color:#94a3b8; margin-left:auto;">${item.name}</span>`;
                    itemDiv.addEventListener('click', function() {
                        styleCodeInput.value = item.style_code;
                        currentStyleCode = item.style_code;
                        closeAllLists();
                        fetchColorsAndPrice(item.style_code, sizeSelect.value);
                    });
                    styleCodeList.appendChild(itemDiv);
                });

            } catch (err) { console.error("Suggestion error:", err); }
        }

        async function fetchColorsAndPrice(styleCode, selectedSize) {
            if(!styleCode) return;
            
            let query = sbClient
                .from('inventory')
                .select('color, mrp')
                .eq('style_code', styleCode);

            if (selectedSize) query = query.eq('size', selectedSize);

            try {
                const { data, error } = await query;
                if (error) throw error;

                const uniqueColors = [...new Set(data.map(item => item.color).filter(c => c))];
                
                colorSelect.innerHTML = '<option value="">Select Color</option>';
                if (uniqueColors.length > 0) {
                    colorSelect.disabled = false;
                    uniqueColors.forEach(color => {
                        const opt = document.createElement("option");
                        opt.value = color; opt.textContent = color;
                        colorSelect.appendChild(opt);
                    });
                } else {
                    colorSelect.disabled = true;
                    colorSelect.innerHTML = '<option value="">No stock</option>';
                }

                if (data && data.length > 0) priceInput.value = data[0].mrp;

            } catch (err) { console.error("Details error:", err); }
        }

        function closeAllLists() { styleCodeList.innerHTML = ''; }

        // --- 4. FORM SUBMISSION ---

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('btnSpinner');
            
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btn.querySelector('span').textContent = "Processing...";

            const formData = {
                booking_date: dateInput.value,
                customer_name: document.getElementById('customerName').value,
                phone: document.getElementById('phone').value,
                size: sizeSelect.value,
                style_code: styleCodeInput.value,
                color: colorSelect.value,
                price: parseFloat(priceInput.value),
                requirement_from: document.getElementById('reqFrom').value,
                status: document.getElementById('status').value
            };

            try {
                const { error } = await sbClient.from('bookings').insert([formData]);
                if (error) throw error;

                showToast("Booking saved successfully", "success");
                form.reset();
                dateInput.valueAsDate = new Date();
                colorSelect.disabled = true;
                priceInput.value = '';
                currentStyleCode = null;
                searchBookings(); 

            } catch (err) {
                console.error("Insert error:", err);
                showToast("Failed to save booking", "error");
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btn.querySelector('span').textContent = "Confirm Booking";
            }
        });

        // --- 5. UPDATE STATUS ---

        async function updateBookingStatus(id, newStatus) {
            // Optimistic UI: No confirm dialog for speed, just toast on error
            try {
                const { error } = await sbClient
                    .from('bookings')
                    .update({ status: newStatus })
                    .eq('id', id);

                if (error) throw error;

                showToast("Status updated", "success");

            } catch (err) {
                console.error("Update error:", err);
                showToast("Failed to update status", "error");
                searchBookings(searchInput.value); // Revert visual
            }
        }

        // --- 6. SEARCH & DISPLAY ---

        searchInput.addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => searchBookings(this.value), 500);
        });

        async function searchBookings(queryTerm = '') {
            if (!sbClient) return;
            bookingsBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px;">Loading...</td></tr>';

            try {
                let dbQuery = sbClient
                    .from('bookings')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (queryTerm && queryTerm.trim() !== '') {
                    dbQuery = dbQuery.or(`customer_name.ilike.%${queryTerm}%,phone.ilike.%${queryTerm}%,style_code.ilike.%${queryTerm}%`);
                }

                const { data, error } = await dbQuery;
                if (error) throw error;

                renderTable(data);

            } catch (err) {
                console.error("Search error:", err);
                bookingsBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--danger);">Error loading data</td></tr>';
            }
        }

        function renderTable(data) {
            bookingsBody.innerHTML = '';
            if (!data || data.length === 0) {
                bookingsBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color:var(--text-muted);">No bookings found.</td></tr>';
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                
                let statusDropdownHtml = `<select class="status-select" onchange="updateBookingStatus(${row.id}, this.value)">`;
                statusOptions.forEach(opt => {
                    const selected = row.status === opt ? 'selected' : '';
                    statusDropdownHtml += `<option value="${opt}" ${selected}>${opt}</option>`;
                });
                statusDropdownHtml += `</select>`;

                tr.innerHTML = `
                    <td>
                        <div style="font-weight:600;">${row.booking_date}</div>
                    </td>
                    <td>
                        <div style="font-weight:600;">${row.customer_name}</div>
                        <span class="text-sm">${row.phone}</span>
                    </td>
                    <td>
                        <div style="font-weight:600; color:var(--primary);">${row.style_code}</div>
                        <div style="display:flex; gap:8px; font-size:0.85em; color:#475569; margin-top:2px;">
                            <span class="badge">${row.size}</span>
                            <span class="badge">${row.color}</span>
                            <span>৳${row.price}</span>
                        </div>
                    </td>
                    <td><span style="font-weight:500;">${row.requirement_from}</span></td>
                    <td>${statusDropdownHtml}</td>
                `;
                bookingsBody.appendChild(tr);
            });
        }

        // --- 7. UTILITIES ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Icon based on type
            const icon = type === 'success' ? '✓' : '✕';
            
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span style="font-weight:bold; font-size:1.2em; margin-right:5px;">${icon}</span> ${message}`;
            container.appendChild(toast);
            
            // Animate in
            requestAnimationFrame(() => toast.classList.add('show'));

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            searchBookings();
        });
    </script>
</body>
</html>
