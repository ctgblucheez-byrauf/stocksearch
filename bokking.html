<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking System | Responsive</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 15px;
        }

        .container {
            max-width: 1400px; 
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr; /* Mobile: Stacked */
            gap: 24px;
        }

        /* Tablet and Desktop: Side by Side */
        @media (min-width: 1024px) {
            .container { grid-template-columns: 380px 1fr; }
            body { padding: 20px; }
        }

        /* Header */
        header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .header-title h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .header-title p { color: var(--text-muted); font-size: 0.8rem; }

        @media (min-width: 600px) {
            .header-title h1 { font-size: 1.5rem; }
            .header-title p { font-size: 0.9rem; }
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 20px;
            border: 1px solid var(--border);
            height: fit-content;
        }
        
        .card-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card-title { font-size: 1.125rem; font-weight: 600; color: var(--text-main); }

        /* Form Elements */
        .form-group { margin-bottom: 16px; position: relative; }
        
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="date"], input[type="tel"], input[type="number"], select {
            width: 100%;
            padding: 12px 12px; /* Taller for touch */
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px; /* Prevents iOS zoom */
            color: var(--text-main);
            background-color: #fff;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border-color: transparent;
            cursor: default;
            font-weight: 500;
        }

        button.btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.btn-primary:hover {
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transform: translateY(-1px);
        }
        button.btn-primary:active { transform: translateY(0); }

        /* Autocomplete */
        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--border);
            z-index: 100;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #fff;
            max-height: 220px;
            overflow-y: auto;
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            box-shadow: var(--shadow-md);
            margin-top: 4px;
        }
        .autocomplete-items div {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .autocomplete-items div:hover { background-color: #f8fafc; }
        .autocomplete-items div strong { color: var(--primary); }

        /* Search Bar */
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }
        .search-container input {
            padding-left: 44px;
            border-radius: 50px;
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Table & Responsive Table (Card View) */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            max-height: 600px; /* Limit height on desktop */
            overflow-y: auto;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 800px; }
        
        thead {
            background-color: #f8fafc;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #fdfdfd; }

        /* Status Select */
        .status-select {
            padding: 6px 10px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: white;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
        }
        .status-select:hover { border-color: var(--primary); }

        /* Action Buttons */
        .action-cell { display: flex; gap: 6px; }

        .copy-btn, .print-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s;
            flex: 1; /* Make buttons equal width on mobile */
        }

        .copy-btn:hover, .print-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: #eff6ff;
        }

        .text-sm { font-size: 0.85em; color: var(--text-muted); display: block; margin-top: 2px; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;
            background: #e2e8f0; color: #475569;
        }

        /* --- RESPONSIVE TABLE (MOBILE CARD VIEW) --- */
        @media screen and (max-width: 768px) {
            .table-wrapper {
                max-height: none; /* Remove scroll limit on mobile */
                overflow-x: visible;
                border: none;
                background: transparent;
                box-shadow: none;
            }

            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr {
                margin: 0 0 16px 0;
                border: 1px solid var(--border);
                border-radius: var(--radius-md);
                background: var(--bg-card);
                padding-bottom: 10px;
                box-shadow: var(--shadow-sm);
            }

            td {
                border: none;
                position: relative;
                padding-left: 50%; /* Space for the label */
                padding-top: 12px;
                padding-bottom: 12px;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                min-height: 40px;
            }

            td:before {
                position: absolute;
                top: 12px;
                left: 12px;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                text-align: left;
                font-weight: 600;
                color: var(--text-muted);
                font-size: 0.8rem;
                text-transform: uppercase;
                content: attr(data-label);
            }

            /* Specific adjustments for mobile cells */
            td[data-label="Action"] {
                padding-left: 12px; /* No label for actions usually, or full width */
                justify-content: flex-start;
            }
            td[data-label="Action"]:before {
                display: none; /* Hide the label "Action" */
            }
            td[data-label="Customer"] {
                flex-direction: column;
                align-items: flex-end;
            }
        }

        /* Toast */
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 2000; }
        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            color: white; 
            padding: 14px 20px; 
            border-radius: 8px;
            margin-top: 10px; 
            box-shadow: var(--shadow-md);
            opacity: 0; 
            transform: translateY(20px); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        /* Spinner */
        .spinner {
            display: none; 
            width: 18px; 
            height: 18px; 
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #ffffff; 
            border-radius: 50%;
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- PRINT STYLES --- */
        #print-container { display: none; }

        @media print {
            body > * { display: none !important; }
            #print-container {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                font-family: 'Courier New', Courier, monospace;
                font-size: 16px;
                line-height: 1.8;
                color: black;
                background: white;
            }
            .print-header { text-align: center; font-weight: bold; font-size: 20px; margin-bottom: 20px; border-bottom: 2px solid black; padding-bottom: 10px; }
            .print-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
            .print-label { font-weight: bold; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Booking Portal</h1>
            <p>Inter-branch requisition management</p>
        </div>
        <!-- Hide profile on very small screens or keep simple -->
        <div class="user-profile" style="display: none;"> 
            <div style="width: 40px; height: 40px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #64748b; font-weight: bold;">AD</div>
        </div>
    </header>

    <div class="container">
        
        <!-- Sidebar: New Booking -->
        <aside class="card">
            <div class="card-header">
                <span class="card-title">New Booking</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </div>
            
            <form id="bookingForm">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="customerName" name="customerName" placeholder="e.g. Rahim Ahmed" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="017..." required>
                </div>

                <div class="form-group">
                    <label>Style Code</label>
                    <input type="text" id="styleCode" name="styleCode" placeholder="Search code..." autocomplete="off" required>
                    <div id="styleCodeList" class="autocomplete-items"></div>
                </div>

                <div class="form-group">
                    <label>Size</label>
                    <select id="size" name="size" required disabled>
                        <option value="">Select Style First</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Available Color</label>
                    <select id="color" name="color" required disabled>
                        <option value="">Select Style & Size</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Price (BDT)</label>
                    <input type="number" id="price" name="price" readonly placeholder="Auto-calculated">
                </div>

                <div class="form-group">
                    <label>Requirement From</label>
                    <select id="reqFrom" name="reqFrom" required>
                        <option value="">Select Branch</option>
                        <option value="JFP">JFP</option>
                        <option value="BANANI">BANANI</option>
                        <option value="KHULNA">KHULNA</option>
                        <option value="TANGAIL">TANGAIL</option>
                        <option value="PMC">PMC</option>
                        <option value="WARI">WARI</option>
                        <option value="BOOKING">Booking</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Initial Status</label>
                    <select id="status" name="status" required>
                        <option value="Requirement Done">Requirement Done</option>
                        <option value="On Hand">On Hand</option>
                        <option value="Hold for customer">Hold for customer</option>
                        <option value="Calling Customer Done">Calling Customer Done</option>
                        <option value="Customer Bill Done">Customer Bill Done</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span>Confirm Booking</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </form>
        </aside>

        <!-- Main Content: Search & List -->
        <main class="card">
            <div class="card-header">
                <span class="card-title">Booking History</span>
                <button onclick="searchBookings()" style="border:none; background:none; cursor:pointer; color:var(--primary); font-size:0.9rem; font-weight:500;">Refresh ↻</button>
            </div>
            
            <div class="search-container">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Search by name, phone, or style code...">
            </div>

            <div class="table-wrapper">
                <table id="bookingsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Product Details</th>
                            <th>Branch</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody">
                        <tr><td colspan="7" style="text-align:center; padding: 40px; color:var(--text-muted);">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Hidden Print Container -->
    <div id="print-container"></div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        // --- 1. CONFIGURATION ---
        const SUPABASE_URL = "https://vrsdpyodfejjuihutgag.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc2RweW9kZmVqanVpaHV0Z2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDU1MjAsImV4cCI6MjA4MzI4MTUyMH0.lHEpLJDfeHBRWElnW11wggWr59yXSgRAff3n1ZFTeDE";
        
        let sbClient;
        try {
            if (window.supabase) {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                showToast("Connection failed.", "error");
            }
        } catch (e) {
            console.error(e);
        }

        // --- 2. DOM ELEMENTS ---
        const form = document.getElementById('bookingForm');
        const styleCodeInput = document.getElementById('styleCode');
        const styleCodeList = document.getElementById('styleCodeList');
        const sizeSelect = document.getElementById('size');
        const colorSelect = document.getElementById('color');
        const priceInput = document.getElementById('price');
        const dateInput = document.getElementById('date');
        const searchInput = document.getElementById('searchInput');
        const bookingsBody = document.getElementById('bookingsBody');

        dateInput.valueAsDate = new Date();

        let currentStyleCode = null;
        let searchTimeout = null;
        let bookingDataCache = [];

        const statusOptions = [
            "Requirement Done", 
            "On Hand", 
            "Hold for customer",
            "Calling Customer Done", 
            "Customer Bill Done"
        ];

        // --- 3. AUTOCOMPLETE & FETCH LOGIC ---

        styleCodeInput.addEventListener('input', function(e) {
            const val = this.value;
            closeAllLists();
            if (!val || val.length < 2) return false;
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => fetchStyleSuggestions(val), 300);
        });

        document.addEventListener('click', function(e) { if (e.target !== styleCodeInput) closeAllLists(); });

        sizeSelect.addEventListener('change', function() {
            if(currentStyleCode) fetchColorsAndPrice(currentStyleCode, this.value);
        });

        async function fetchStyleSuggestions(query) {
            try {
                const { data, error } = await sbClient
                    .from('inventory')
                    .select('style_code, name, mrp')
                    .or(`style_code.ilike.%${query}%,name.ilike.%${query}%`)
                    .limit(10);
                if (error) throw error;
                styleCodeList.innerHTML = '';
                if (!data || data.length === 0) {
                    const noResult = document.createElement("div"); noResult.innerText = "No matches found";
                    styleCodeList.appendChild(noResult); return;
                }
                data.forEach(item => {
                    const itemDiv = document.createElement("div");
                    itemDiv.innerHTML = `<strong>${item.style_code}</strong> <span style="color:#94a3b8; margin-left:auto;">${item.name}</span>`;
                    itemDiv.addEventListener('click', function() {
                        styleCodeInput.value = item.style_code;
                        currentStyleCode = item.style_code;
                        closeAllLists();
                        fetchSizes(item.style_code);
                    });
                    styleCodeList.appendChild(itemDiv);
                });
            } catch (err) { console.error(err); }
        }

        async function fetchSizes(styleCode) {
            if(!styleCode) return;
            colorSelect.innerHTML = '<option value="">Select Size</option>';
            colorSelect.disabled = true;
            priceInput.value = '';
            
            try {
                const { data, error } = await sbClient
                    .from('inventory')
                    .select('size')
                    .eq('style_code', styleCode);

                if (error) throw error;
                const uniqueSizes = [...new Set(data.map(item => item.size).filter(s => s))];
                
                sizeSelect.innerHTML = '<option value="">Select Size</option>';
                
                if (uniqueSizes.length > 0) {
                    sizeSelect.disabled = false;
                    uniqueSizes.forEach(size => {
                        const opt = document.createElement("option");
                        opt.value = size; 
                        opt.textContent = size;
                        sizeSelect.appendChild(opt);
                    });
                } else {
                    sizeSelect.disabled = true;
                    sizeSelect.innerHTML = '<option value="">No sizes available</option>';
                }

            } catch (err) { 
                console.error("Error fetching sizes:", err);
                sizeSelect.disabled = true;
            }
        }

        async function fetchColorsAndPrice(styleCode, selectedSize) {
            if(!styleCode || !selectedSize) return;
            
            let query = sbClient.from('inventory').select('color, mrp').eq('style_code', styleCode);
            query = query.eq('size', selectedSize);

            try {
                const { data, error } = await query;
                if (error) throw error;

                const uniqueColors = [...new Set(data.map(item => item.color).filter(c => c))];
                
                colorSelect.innerHTML = '<option value="">Select Color</option>';
                if (uniqueColors.length > 0) {
                    colorSelect.disabled = false; uniqueColors.forEach(color => {
                        const opt = document.createElement("option"); opt.value = color; opt.textContent = color; colorSelect.appendChild(opt);
                    });
                } else { colorSelect.disabled = true; colorSelect.innerHTML = '<option value="">No color</option>'; }
                
                if (data && data.length > 0) priceInput.value = data[0].mrp;

            } catch (err) { console.error(err); }
        }

        function closeAllLists() { styleCodeList.innerHTML = ''; }

        // --- 4. FORM SUBMISSION ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); const spinner = document.getElementById('btnSpinner');
            btn.disabled = true; spinner.style.display = 'inline-block'; btn.querySelector('span').textContent = "Processing...";

            const formData = {
                booking_date: dateInput.value, customer_name: document.getElementById('customerName').value,
                phone: document.getElementById('phone').value, size: sizeSelect.value,
                style_code: styleCodeInput.value, color: colorSelect.value,
                price: parseFloat(priceInput.value), requirement_from: document.getElementById('reqFrom').value,
                status: document.getElementById('status').value
            };

            try {
                const { error } = await sbClient.from('bookings').insert([formData]);
                if (error) throw error;
                showToast("Booking saved successfully", "success");
                form.reset(); dateInput.valueAsDate = new Date(); colorSelect.disabled = true; priceInput.value = ''; currentStyleCode = null;
                searchBookings();
            } catch (err) {
                console.error(err); showToast("Failed to save booking", "error");
            } finally {
                btn.disabled = false; spinner.style.display = 'none'; btn.querySelector('span').textContent = "Confirm Booking";
            }
        });

        // --- 5. UPDATE STATUS ---
        async function updateBookingStatus(id, newStatus) {
            try {
                const { error } = await sbClient.from('bookings').update({ status: newStatus }).eq('id', id);
                if (error) throw error;
                showToast("Status updated", "success");
            } catch (err) {
                console.error(err); showToast("Failed to update status", "error"); searchBookings(searchInput.value);
            }
        }

        // --- 6. COPY LOGIC ---
        function timeSince(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " mins ago";
            return "Just now";
        }

        async function copyBooking(id) {
            const row = bookingDataCache.find(b => b.id === id);
            if (!row) return;

            const textToCopy = `DATE: ${row.booking_date}
NAME: ${row.customer_name}
PHONE: ${row.phone}
STYLE CODE: ${row.style_code}
SIZE: ${row.size}
COLOR: ${row.color}
REQUIREMENT FROM: ${row.requirement_from}`;

            try {
                await navigator.clipboard.writeText(textToCopy);
                showToast("Copied to clipboard!", "success");
            } catch (err) {
                showToast("Failed to copy", "error");
            }
        }

        // --- 6.5 PRINT LOGIC ---
        function printBooking(id) {
            const row = bookingDataCache.find(b => b.id === id);
            if (!row) return;

            const printContent = `
                <div class="print-header">BOOKING SLIP</div>
                <div class="print-row"><span class="print-label">DATE:</span> <span>${row.booking_date}</span></div>
                <div class="print-row"><span class="print-label">NAME:</span> <span>${row.customer_name}</span></div>
                <div class="print-row"><span class="print-label">PHONE:</span> <span>${row.phone}</span></div>
                <div class="print-row"><span class="print-label">STYLE CODE:</span> <span>${row.style_code}</span></div>
                <div class="print-row"><span class="print-label">SIZE:</span> <span>${row.size}</span></div>
                <div class="print-row"><span class="print-label">COLOR:</span> <span>${row.color}</span></div>
                <div class="print-row"><span class="print-label">REQUIREMENT FROM:</span> <span>${row.requirement_from}</span></div>
            `;

            const printContainer = document.getElementById('print-container');
            printContainer.innerHTML = printContent;
            window.print();
        }

        // --- 7. SEARCH & DISPLAY ---
        searchInput.addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => searchBookings(this.value), 500);
        });

        async function searchBookings(queryTerm = '') {
            if (!sbClient) return;
            bookingsBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px;">Loading...</td></tr>';
            try {
                let dbQuery = sbClient.from('bookings').select('*').order('created_at', { ascending: false }).limit(50);
                if (queryTerm && queryTerm.trim() !== '') {
                    dbQuery = dbQuery.or(`customer_name.ilike.%${queryTerm}%,phone.ilike.%${queryTerm}%,style_code.ilike.%${queryTerm}%`);
                }
                const { data, error } = await dbQuery;
                if (error) throw error;
                bookingDataCache = data; 
                renderTable(data);
            } catch (err) {
                console.error(err);
                bookingsBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--danger);">Error loading data</td></tr>';
            }
        }

        function renderTable(data) {
            bookingsBody.innerHTML = '';
            if (!data || data.length === 0) {
                bookingsBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color:var(--text-muted);">No bookings found.</td></tr>';
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                const timeAgo = timeSince(new Date(row.created_at));
                
                let statusDropdownHtml = `<select class="status-select" onchange="updateBookingStatus(${row.id}, this.value)">`;
                statusOptions.forEach(opt => {
                    const selected = row.status === opt ? 'selected' : '';
                    statusDropdownHtml += `<option value="${opt}" ${selected}>${opt}</option>`;
                });
                statusDropdownHtml += `</select>`;

                // NOTE: Added data-label attributes for Mobile Card View
                tr.innerHTML = `
                    <td data-label="Date"><div style="font-weight:600;">${row.booking_date}</div></td>
                    <td data-label="Customer">
                        <div style="font-weight:600;">${row.customer_name}</div>
                        <span class="text-sm">${row.phone}</span>
                    </td>
                    <td data-label="Product Details">
                        <div style="font-weight:600; color:var(--primary);">${row.style_code}</div>
                        <div style="display:flex; gap:8px; font-size:0.85em; color:#475569; margin-top:2px;">
                            <span class="badge">${row.size}</span>
                            <span class="badge">${row.color}</span>
                            <span>৳${row.price}</span>
                        </div>
                    </td>
                    <td data-label="Branch"><span style="font-weight:500;">${row.requirement_from}</span></td>
                    <td data-label="Status">${statusDropdownHtml}</td>
                    <td data-label="Created" style="font-size:0.85rem; color:#64748b;">${timeAgo}</td>
                    <td data-label="Action">
                        <div class="action-cell">
                            <button class="copy-btn" onclick="copyBooking(${row.id})" title="Copy details">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                Copy
                            </button>
                            <button class="print-btn" onclick="printBooking(${row.id})" title="Print slip">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                                Print
                            </button>
                        </div>
                    </td>
                `;
                bookingsBody.appendChild(tr);
            });
        }

        // --- 8. UTILITIES ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '✓' : '✕';
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span style="font-weight:bold; font-size:1.2em; margin-right:5px;">${icon}</span> ${message}`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', () => { searchBookings(); });
    </script>
</body>
</html>
