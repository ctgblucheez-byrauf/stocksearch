<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority - Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 { margin-bottom: 1.5rem; color: #3b82f6; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #6b7280; }
        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box; /* Important for padding */
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { opacity: 0.9; }
        .login-error {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Authority Panel</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-input" placeholder="Enter username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter password" required>
            </div>
            <div id="login-error" class="login-error"></div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            // Hardcoded credentials from your original request
            if (u === 'blucheeztm' && p === 'oppeen22') {
                // --- CHANGED: Use localStorage to persist login ---
                localStorage.setItem('auth_token', 'valid');
                
                loginError.textContent = '';
                // Redirect to index.html
                window.location.href = 'index.html';
            } else {
                loginError.textContent = 'Invalid credentials';
            }
        });
    </script>
</body>
</html>
