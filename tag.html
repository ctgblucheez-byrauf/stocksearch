<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Tag</title>
    
    <!-- Load JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        :root {
            /* 1 inch = 96px, 2.5 inches = 240px */
            --tag-width: 96px;  
            --tag-height: 240px; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #e0e0e0;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* --- Controls --- */
        .controls-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 { font-size: 1.2rem; margin-bottom: 15px; font-weight: 500; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn-fetch { background-color: #000; color: white; }
        .btn-print { 
            background-color: #333; 
            color: white; 
            width: 100%; 
            margin-top: 10px; 
            display: none; 
        }

        .status-message { font-size: 0.85rem; margin-top: 10px; }
        .status-error { color: #d32f2f; }
        .status-success { color: #2e7d32; }

        /* --- THE TAG (1" x 2.5") --- */
        .tag-wrapper { margin: 20px; }

        #price-tag {
            background: white;
            width: var(--tag-width);
            height: var(--tag-height);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #000; 
            overflow: hidden;
            padding-top: 4px;
        }

        /* --- HEADER --- */
        .brand-box {
            margin: 0 4px;
            margin-bottom: 15px; 
            padding: 2px 0;
            border: 1px solid #000;
            text-align: center;
            width: calc(100% - 8px); 
        }

        .brand-name {
            font-size: 9px;
            font-weight: 900; 
            text-transform: uppercase;
            color: #000;
        }

        .product-name {
            text-align: center;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 15px; 
            padding: 0 2px;
            line-height: 1.2;
        }

        /* --- CONTENT WRAPPER --- */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; 
            padding: 0 4px;
            margin-bottom: 15px; 
            width: 100%;
        }

        /* --- ELEMENTS --- */
        .info-text {
            text-align: center;
            font-weight: 900;
            font-size: 7px;
            line-height: 1.1;
            word-wrap: break-word;
            width: 100%;
        }

        .size-block {
            text-align: center;
        }

        .size-label {
            font-size: 6px;
            font-weight: 800;
            display: block;
            margin-bottom: 1px;
        }

        .size-value {
            font-size: 13px; 
            font-weight: 900; 
            display: block;
            line-height: 1;
        }

        .barcode-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #barcode-canvas {
            width: 100%;
            max-width: 84px;
            height: auto;
        }

        .barcode-number {
            font-family: 'Courier New', monospace;
            font-size: 8px; 
            font-weight: 900;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* --- FOOTER --- */
        .tag-footer {
            border-top: 1px solid #000;
            padding: 4px 2px; /* Reduced side padding for text fit */
            display: flex;
            justify-content: center; /* Centered */
            align-items: center;
            width: 100%; 
        }

        .price-full-text {
            font-size: 7px; /* Small font to fit "BDT. 5,490.00 (+VAT)" */
            font-weight: 900; 
            text-align: center;
            line-height: 1.2;
        }

        /* --- PRINT STYLES --- */
        @media print {
            body { 
                background: white; 
                margin: 0; 
                padding: 0;
                display: block;
            }

            .controls-container, .no-print {
                display: none !important;
            }

            .tag-wrapper {
                margin: 0;
                top: 0;
                left: 0;
                transform: none;
            }

            #price-tag {
                box-shadow: none;
                width: var(--tag-width);
                height: var(--tag-height);
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
            }
            
            @page {
                size: auto;
                margin: 0mm;
            }
        }
    </style>
</head>
<body>

    <div class="controls-container no-print">
        <h1>Tag Generator (Blucheez)</h1>
        <div class="input-group">
            <input type="text" id="barcodeInput" placeholder="Barcode (e.g. A021103)" autocomplete="off">
            <button class="btn-fetch" onclick="fetchData()">Fetch</button>
        </div>
        <div id="statusMsg" class="status-message"></div>
        <button id="printBtn" class="btn-print no-print" onclick="printTag()">Print Tag</button>
    </div>

    <!-- 1" x 2.5" Tag -->
    <div class="tag-wrapper">
        <div id="price-tag">
            <!-- Header: Blucheez -->
            <div class="brand-box">
                <div class="brand-name">Blucheez</div>
            </div>

            <!-- Product Name: Jacket -->
            <div class="product-name" id="tagName">JACKET</div>

            <!-- Balanced Layout Wrapper -->
            <div class="content-wrapper">
                
                <!-- 1. Style Code -->
                <div class="info-text" id="tagStyle">AB-WIN54-BMJ-039</div>

                <!-- 2. Color: Updated to "COLOR: BLACK" -->
                <div class="info-text" id="tagColor">COLOR: BLACK</div>

                <!-- 3. Size -->
                <div class="size-block">
                    <span class="size-label">SIZE</span>
                    <span class="size-value" id="tagSize">S</span>
                </div>

                <!-- 4. Barcode -->
                <div class="barcode-block">
                    <svg id="barcode-canvas"></svg>
                    <div class="barcode-number" id="tagBarcodeText">A021103</div>
                </div>
                
            </div>

            <!-- Footer: Updated to "BDT. 5,490.00 (+VAT)" -->
            <div class="tag-footer">
                <span class="price-full-text" id="tagPrice">BDT. 5,490.00 (+VAT)</span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const SUPABASE_URL = "https://vrsdpyodfejjuihutgag.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc2RweW9kZmVqanVpaHV0Z2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDU1MjAsImV4cCI6MjA4MzI4MTUyMH0.lHEpLJDfeHBRWElnW11wggWr59yXSgRAff3n1ZFTeDE";
        
        let sbClient;
        
        try {
            if (window.supabase) {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                showStatus("Error: Supabase library failed to load.", "error");
            }
        } catch (e) { 
            console.error("Init error", e); 
            showStatus("Init Error: " + e.message, "error");
        }

        const barcodeInput = document.getElementById('barcodeInput');
        const statusMsg = document.getElementById('statusMsg');
        const printBtn = document.getElementById('printBtn');

        const elName = document.getElementById('tagName');
        const elStyle = document.getElementById('tagStyle');
        const elColor = document.getElementById('tagColor');
        const elSize = document.getElementById('tagSize');
        const elPrice = document.getElementById('tagPrice');
        const elBarcodeText = document.getElementById('tagBarcodeText');

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = 'status-message ' + (type === 'error' ? 'status-error' : 'status-success');
            if(type === 'success') {
                setTimeout(() => { if(statusMsg.textContent === msg) statusMsg.textContent = ''; }, 5000);
            }
        }

        function formatPrice(mrp) {
            if (!mrp) return "BDT. 0.00 (+VAT)";
            // Format: BDT. 5,490.00 (+VAT)
            return "BDT. " + parseFloat(mrp).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,') + " (+VAT)";
        }

        async function fetchData() {
            const query = barcodeInput.value.trim();
            if (!query) { showStatus("Please enter a barcode.", "error"); return; }
            
            showStatus("Searching...", "success");
            printBtn.style.display = 'none';

            try {
                const { data, error } = await sbClient
                    .from('inventory')
                    .select('*')
                    .eq('barcode', query)
                    .maybeSingle();

                if (error) {
                    throw error; 
                }
                
                if (!data) { 
                    showStatus("Barcode not found in database.", "error"); 
                    resetTag(); 
                    return; 
                }

                populateTag(data);
                showStatus("Loaded successfully!", "success");
                printBtn.style.display = 'block';
            } catch (err) {
                console.error("Fetch Error:", err);
                showStatus("DB Error: " + err.message, "error");
            }
        }

        function populateTag(item) {
            elName.textContent = item.name || "ITEM";
            elStyle.textContent = item.style_code || "--";
            
            // Update Color to format "COLOR: BLACK"
            elColor.textContent = "COLOR: " + (item.color ? item.color.toUpperCase() : "--");
            
            elSize.textContent = item.size || "--";
            elPrice.textContent = formatPrice(item.mrp);
            elBarcodeText.textContent = item.barcode;

            try {
                JsBarcode("#barcode-canvas", item.barcode, {
                    format: "CODE128",
                    lineColor: "#000",
                    width: 1.0,      
                    height: 30,      
                    displayValue: false, 
                    margin: 0
                });
            } catch (e) {
                console.error("Barcode Error", e);
            }
        }

        function resetTag() {
            elName.textContent = "ITEM";
            elStyle.textContent = "--";
            elColor.textContent = "COLOR: --";
            elSize.textContent = "--";
            elPrice.textContent = "BDT. 0.00 (+VAT)";
            elBarcodeText.textContent = "--";
            document.getElementById('barcode-canvas').innerHTML = "";
        }

        function printTag() {
            window.print();
        }

        barcodeInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") { e.preventDefault(); fetchData(); }
        });
    </script>
</body>
</html>
