<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Tag Generator</title>
    
    <!-- Load JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        :root {
            --brand-color: #1a1a1a;
            --text-primary: #222;
            --text-secondary: #777;
            --bg-color: #eef1f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* --- Controls Section --- */
        .controls-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            color: var(--brand-color);
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-fetch {
            background-color: var(--brand-color);
            color: white;
        }

        .btn-print {
            background-color: white;
            color: var(--brand-color);
            border: 1px solid var(--brand-color);
            width: 100%;
            margin-top: 10px;
            display: none;
        }

        .btn-print:hover { background-color: #f5f5f5; }
        button:active { transform: scale(0.98); }

        .status-message {
            font-size: 0.85rem;
            height: 20px;
            margin-top: 10px;
        }
        .status-error { color: #d32f2f; }
        .status-success { color: #2e7d32; }

        /* --- SMALLER TAG DESIGN --- */
        .tag-wrapper {
            perspective: 1000px;
        }

        #price-tag {
            background: white;
            width: 230px; /* Small Width */
            height: 350px; /* Small Height */
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Realistic Hole Punch */
        #price-tag::before {
            content: '';
            position: absolute;
            top: 12px; /* Closer to top since header is gone */
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background-color: #eef1f5;
            border-radius: 50%;
            z-index: 10;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
        }

        /* Body Section */
        .tag-body {
            flex: 1;
            padding: 25px 20px 10px 20px; /* Top padding allows space for hole */
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-size: 0.85rem; /* Slightly smaller */
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-primary);
            text-align: center;
            line-height: 1.3;
            margin-bottom: 15px;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Technical details */
        .specs-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 10px;
        }

        .spec-item {
            text-align: center;
            width: 32%;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center align items */
        }

        .spec-label {
            display: block;
            font-size: 0.5rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .spec-value {
            display: block;
            font-size: 0.65rem; /* Smaller font to fit long style codes */
            font-weight: 700;
            color: var(--brand-color);
            word-wrap: break-word; /* Allow wrapping for long codes */
            hyphens: auto;
        }

        /* Barcode Section */
        .barcode-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
        }

        #barcode-canvas {
            width: 100%;
            max-width: 190px;
            height: auto;
        }

        .barcode-number {
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            letter-spacing: 1px;
            margin-top: 4px;
            color: #555;
        }

        /* Footer / Price Section */
        .tag-footer {
            background-color: #fcfcfc;
            border-top: 2px solid var(--brand-color);
            padding: 12px 20px;
            text-align: center;
        }

        .price-label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 1px;
        }

        .price-value {
            font-size: 1.4rem; /* Slightly smaller */
            font-weight: 800;
            color: var(--brand-color);
            line-height: 1;
        }

        .vat-info {
            font-size: 0.55rem;
            color: #888;
            margin-top: 4px;
            font-weight: 500;
        }

        /* --- Print Styles --- */
        @media print {
            body * {
                visibility: hidden;
            }
            #price-tag, #price-tag * {
                visibility: visible;
            }
            
            body {
                background: white;
                margin: 0;
                padding: 0;
            }

            .tag-wrapper {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }

            #price-tag {
                box-shadow: none;
                border: 1px solid #ccc;
                width: 230px;
                height: 350px;
                page-break-inside: avoid;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <div class="controls-container no-print">
        <h1>Tag Generator</h1>
        <div class="input-group">
            <input type="text" id="barcodeInput" placeholder="Enter Barcode (e.g. A012397)" autocomplete="off">
            <button class="btn-fetch" onclick="fetchData()">Fetch</button>
        </div>
        <div id="statusMsg" class="status-message"></div>
        <button id="printBtn" class="btn-print no-print" onclick="printTag()">Print Tag</button>
    </div>

    <!-- The Compact Tag -->
    <div class="tag-wrapper">
        <div id="price-tag">
            <!-- Header Removed -->
            
            <div class="tag-body">
                <div class="product-name" id="tagName">--</div>

                <div class="specs-row">
                    <div class="spec-item">
                        <span class="spec-label">Style</span>
                        <!-- Word wrap added to CSS to handle long codes like IMC-FL53-WWT-063 -->
                        <span class="spec-value" id="tagStyle">--</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Color</span>
                        <span class="spec-value" id="tagColor">--</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Size</span>
                        <span class="spec-value" id="tagSize">--</span>
                    </div>
                </div>

                <div class="barcode-container">
                    <svg id="barcode-canvas"></svg>
                    <div class="barcode-number" id="tagBarcodeText">--</div>
                </div>
            </div>

            <div class="tag-footer">
                <div class="price-label">Retail Price</div>
                <div class="price-value" id="tagPrice">BDT 0.00</div>
                <div class="vat-info">VAT Inclusive</div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const SUPABASE_URL = "https://vrsdpyodfejjuihutgag.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc2RweW9kZmVqanVpaHV0Z2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDU1MjAsImV4cCI6MjA4MzI4MTUyMH0.lHEpLJDfeHBRWElnW11wggWr59yXSgRAff3n1ZFTeDE";
        
        let sbClient;
        
        try {
            if (window.supabase) {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                console.error("Supabase library failed to load.");
                showStatus("Error: Library failed to load.", "error");
            }
        } catch (e) {
            console.error("Init error:", e);
        }

        // --- 2. DOM ELEMENTS ---
        const barcodeInput = document.getElementById('barcodeInput');
        const statusMsg = document.getElementById('statusMsg');
        const printBtn = document.getElementById('printBtn');

        const elName = document.getElementById('tagName');
        const elStyle = document.getElementById('tagStyle');
        const elColor = document.getElementById('tagColor');
        const elSize = document.getElementById('tagSize');
        const elPrice = document.getElementById('tagPrice');
        const elBarcodeText = document.getElementById('tagBarcodeText');

        // --- 3. FUNCTIONS ---
        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = 'status-message ' + (type === 'error' ? 'status-error' : 'status-success');
            if(type === 'success') {
                setTimeout(() => {
                    if(statusMsg.textContent === msg) statusMsg.textContent = '';
                }, 3000);
            }
        }

        function formatPrice(mrp) {
            if (!mrp) return "BDT 0.00";
            return "BDT " + parseFloat(mrp).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
        }

        async function fetchData() {
            const query = barcodeInput.value.trim();
            if (!query) {
                showStatus("Please enter a barcode.", "error");
                return;
            }
            showStatus("Searching database...", "success");
            printBtn.style.display = 'none';

            try {
                const { data, error } = await sbClient
                    .from('inventory')
                    .select('*')
                    .eq('barcode', query)
                    .maybeSingle();

                if (error) throw error;
                if (!data) {
                    showStatus(`Not found: "${query}"`, "error");
                    resetTag();
                    return;
                }

                populateTag(data);
                showStatus("Item loaded successfully!", "success");
                printBtn.style.display = 'block';

            } catch (err) {
                console.error(err);
                showStatus("Error connecting to database.", "error");
            }
        }

        function populateTag(item) {
            elName.textContent = item.name || "Unknown Item";
            elStyle.textContent = item.style_code || "--";
            elColor.textContent = item.color || "--";
            elSize.textContent = item.size || "--";
            elPrice.textContent = formatPrice(item.mrp);
            elBarcodeText.textContent = item.barcode;

            try {
                JsBarcode("#barcode-canvas", item.barcode, {
                    format: "CODE128",
                    width: 1.4,
                    height: 40,
                    displayValue: false,
                    margin: 0,
                    lineColor: "#000"
                });
            } catch (e) {
                console.error("Barcode generation failed", e);
            }
        }

        function resetTag() {
            elName.textContent = "--";
            elStyle.textContent = "--";
            elColor.textContent = "--";
            elSize.textContent = "--";
            elPrice.textContent = "BDT 0.00";
            elBarcodeText.textContent = "--";
            document.getElementById('barcode-canvas').innerHTML = "";
        }

        function printTag() {
            window.print();
        }

        barcodeInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                fetchData();
            }
        });
    </script>
</body>
</html>
