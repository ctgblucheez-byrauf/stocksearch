<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blucheez Tag Printer (Unified Size)</title>
    
    <!-- Load JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        :root {
            /* --- TAG DIMENSIONS (Unified) --- */
            /* 1 inch = 25.4mm, 2.5 inches = 63.5mm */
            /* 1 inch = 96px (screen) */
            --tag-w-px: 96px;
            --tag-h-px: 240px;
            
            --tag-w-mm: 25.4mm;
            --tag-h-mm: 63.5mm;

            /* --- A4 PAGE CONFIG --- */
            --a4-page-w: 210mm;
            --a4-page-h: 297mm;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #e0e0e0;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* =========================================
           UI CONTROLS
           ========================================= */
        .controls-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 { font-size: 1.2rem; margin-bottom: 15px; font-weight: 500; }
        
        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .mode-btn {
            background: #eee;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .mode-btn.active {
            background: #000;
            color: white;
        }

        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button.action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn-fetch { background-color: #000; color: white; }
        
        .queue-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-print { 
            background-color: #333; 
            color: white; 
            margin-top: 10px; 
            width: 100%;
        }
        
        .btn-clear { background-color: #d32f2f; color: white; }

        .status-message { font-size: 0.85rem; margin-top: 10px; }
        .status-error { color: #d32f2f; }
        .status-success { color: #2e7d32; }
        .queue-info { font-size: 0.8rem; color: #555; margin-top: 5px; }

        /* =========================================
           VISIBILITY TOGGLES
           ========================================= */
        body:not(.a4-mode) .a4-wrapper { display: none; }
        body:not(.a4-mode) .queue-controls { display: none; }
        body:not(.a4-mode) .btn-print-thermal { display: none; }

        body.a4-mode .thermal-wrapper { display: none; }

        /* =========================================
           SHARED TAG DESIGN (.tag-design)
           ========================================= */
        /* This is the MASTER design. Used for both Thermal and A4. */
        .tag-design {
            background: white;
            width: var(--tag-w-px);
            height: var(--tag-h-px);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #000; 
            overflow: hidden;
            padding-top: 4px;
            /* Ensures print color accuracy */
            -webkit-print-color-adjust: exact; 
            print-color-adjust: exact;
        }

        .tag-brand-box {
            margin: 0 4px;
            margin-bottom: 15px; 
            padding: 2px 0;
            border: 1px solid #000;
            text-align: center;
            width: calc(100% - 8px); 
        }

        .tag-brand-name {
            font-size: 9px;
            font-weight: 900; 
            text-transform: uppercase;
            color: #000;
        }

        .tag-product-name {
            text-align: center;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 15px; 
            padding: 0 2px;
            line-height: 1.2;
        }

        .tag-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; 
            padding: 0 4px;
            margin-bottom: 15px; 
            width: 100%;
        }

        .tag-info-text {
            text-align: center;
            font-weight: 900;
            font-size: 7px;
            line-height: 1.1;
            word-wrap: break-word;
            width: 100%;
        }

        .tag-size-block { text-align: center; }
        .tag-size-label { font-size: 6px; font-weight: 800; display: block; margin-bottom: 1px; }
        .tag-size-value { font-size: 13px; font-weight: 900; display: block; line-height: 1; }

        .tag-barcode-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .tag-barcode-canvas { width: 100%; max-width: 84px; height: auto; }

        .tag-barcode-number {
            font-family: 'Courier New', monospace;
            font-size: 8px; 
            font-weight: 900;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .tag-footer {
            border-top: 1px solid #000;
            padding: 4px 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%; 
        }

        .tag-price-text {
            font-size: 7px; 
            font-weight: 900; 
            text-align: center;
            line-height: 1.2;
        }

        /* =========================================
           MODE SPECIFIC CONTAINERS
           ========================================= */
        
        /* 1. Thermal View Wrapper */
        .thermal-wrapper { margin: 20px; }

        /* 2. A4 View Wrapper */
        .a4-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* A4 Page Setup */
        .a4-page {
            background: white;
            width: var(--a4-page-w);
            min-height: var(--a4-page-h);
            padding: 10mm; 
            display: grid;
            /* 7 columns x 4 rows to fit 1"x2.5" tags on A4 */
            grid-template-columns: repeat(7, var(--tag-w-mm));
            grid-auto-rows: var(--tag-h-mm);
            gap: 3mm; /* Gap between labels */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            page-break-after: always;
        }

        /* A4 Grid Cell */
        .a4-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #fafafa; /* Light grey background for preview contrast */
            /* No rotation needed because size matches */
        }

        /* =========================================
           PRINT STYLES
           ========================================= */
        @media print {
            body { 
                background: white; 
                margin: 0; 
                padding: 0;
                display: block;
            }

            .controls-container, .no-print { display: none !important; }

            /* --- THERMAL PRINT --- */
            body:not(.a4-mode) .thermal-wrapper { margin: 0; position: absolute; top: 0; left: 0; }
            body:not(.a4-mode) .tag-design { box-shadow: none; }

            /* --- A4 PRINT --- */
            body.a4-mode .a4-wrapper { display: block; width: 100%; }
            
            body.a4-mode .a4-page {
                box-shadow: none;
                margin: 0;
                width: var(--a4-page-w);
                height: var(--a4-page-h);
                page-break-after: always;
            }
            
            /* Remove preview styling for A4 cells */
            body.a4-mode .a4-cell {
                background: none;
            }
            
            @page {
                size: auto;
                margin: 0mm;
            }
        }
    </style>
</head>
<body class="">

    <div class="controls-container no-print">
        <h1>Blucheez Tag Printer</h1>
        
        <div class="mode-switch">
            <button class="mode-btn active" id="btnModeThermal" onclick="setMode('thermal')">Thermal (1"x2.5")</button>
            <button class="mode-btn" id="btnModeA4" onclick="setMode('a4')">A4 Sheet (Same Size)</button>
        </div>

        <div class="input-group">
            <input type="text" id="barcodeInput" placeholder="Scan Barcode..." autocomplete="off">
            <button class="action-btn btn-fetch" id="fetchBtn" onclick="fetchData()">Fetch</button>
        </div>
        
        <div id="statusMsg" class="status-message"></div>
        <div id="queueInfo" class="queue-info" style="display:none;">Queue: 0 items</div>

        <button id="printBtnThermal" class="action-btn btn-print btn-print-thermal" onclick="printTag()">Print Thermal Tag</button>

        <div class="queue-controls">
            <button class="action-btn btn-clear" onclick="clearQueue()">Clear All</button>
            <button class="action-btn btn-print" onclick="window.print()">Print A4 Sheet</button>
        </div>
    </div>

    <!-- =========================================
         1. THERMAL PREVIEW
         ========================================= -->
    <div class="thermal-wrapper">
        <!-- The tag design is injected here -->
        <div id="thermal-container"></div>
    </div>

    <!-- =========================================
         2. A4 PREVIEW CONTAINER
         ========================================= -->
    <div class="a4-wrapper" id="a4PreviewContainer">
        <!-- Dynamic Pages will be injected here -->
        <div class="a4-page" id="a4Page1"></div>
    </div>

    <script>
        // --- 1. CONFIGURATION & STATE ---
        const SUPABASE_URL = "https://vrsdpyodfejjuihutgag.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc2RweW9kZmVqanVpaHV0Z2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDU1MjAsImV4cCI6MjA4MzI4MTUyMH0.lHEpLJDfeHBRWElnW11wggWr59yXSgRAff3n1ZFTeDE";
        
        let sbClient;
        let currentMode = 'thermal';
        let tagsQueue = [];

        // DOM Elements
        const barcodeInput = document.getElementById('barcodeInput');
        const statusMsg = document.getElementById('statusMsg');
        const queueInfo = document.getElementById('queueInfo');
        const a4Container = document.getElementById('a4PreviewContainer');
        const thermalContainer = document.getElementById('thermal-container');
        const fetchBtn = document.getElementById('fetchBtn');

        // --- 2. HELPER FUNCTIONS ---
        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = 'status-message ' + (type === 'error' ? 'status-error' : 'status-success');
            if(type === 'success') setTimeout(() => { if(statusMsg.textContent === msg) statusMsg.textContent = ''; }, 5000);
        }

        function formatPrice(mrp) {
            if (!mrp) return "BDT. 0.00 (+VAT)";
            return "BDT. " + parseFloat(mrp).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,') + " (+VAT)";
        }

        // Init Supabase
        try {
            if (window.supabase) {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                showStatus("Error: Supabase library failed to load.", "error");
            }
        } catch (e) { console.error("Init error", e); }

        // --- 3. UNIFIED TAG GENERATOR ---
        // This function returns the HTML for the standard tag design
        function getTagHTML(item, suffix) {
            const bcId = `bc-${suffix}`;
            
            return `
                <div class="tag-design">
                    <div class="tag-brand-box">
                        <div class="tag-brand-name">Blucheez</div>
                    </div>
                    <div class="tag-product-name">${item.name || "ITEM"}</div>
                    <div class="tag-content-wrapper">
                        <div class="tag-info-text">${item.style_code || "--"}</div>
                        <div class="tag-info-text">COLOR: ${item.color ? item.color.toUpperCase() : "--"}</div>
                        <div class="tag-size-block">
                            <span class="tag-size-label">SIZE</span>
                            <span class="tag-size-value">${item.size || "--"}</span>
                        </div>
                        <div class="tag-barcode-block">
                            <svg id="${bcId}" class="tag-barcode-canvas"></svg>
                            <div class="tag-barcode-number">${item.barcode}</div>
                        </div>
                    </div>
                    <div class="tag-footer">
                        <span class="tag-price-text">${formatPrice(item.mrp)}</span>
                    </div>
                </div>
            `;
        }

        // --- 4. MODE SWITCHING ---
        function setMode(mode) {
            currentMode = mode;
            document.body.className = mode === 'a4' ? 'a4-mode' : '';
            
            document.getElementById('btnModeThermal').classList.toggle('active', mode === 'thermal');
            document.getElementById('btnModeA4').classList.toggle('active', mode === 'a4');
            
            if (mode === 'a4') {
                fetchBtn.textContent = "Add to Queue";
                queueInfo.style.display = 'block';
                renderA4Grid();
            } else {
                fetchBtn.textContent = "Fetch";
                queueInfo.style.display = 'none';
                thermalContainer.innerHTML = '';
            }
            
            barcodeInput.value = '';
            barcodeInput.focus();
        }

        // --- 5. DATA FETCHING ---
        async function fetchData() {
            const query = barcodeInput.value.trim();
            if (!query) { showStatus("Please scan a barcode.", "error"); return; }
            
            showStatus("Processing...", "success");

            try {
                const { data, error } = await sbClient
                    .from('inventory')
                    .select('*')
                    .eq('barcode', query)
                    .maybeSingle();

                if (error) throw error; 
                if (!data) { 
                    showStatus("Barcode not found.", "error"); 
                    return; 
                }

                if (currentMode === 'thermal') {
                    renderThermalTag(data);
                    showStatus("Loaded! Ready to print.", "success");
                } else {
                    addToQueue(data);
                }
                
                barcodeInput.value = '';
                barcodeInput.focus();

            } catch (err) {
                console.error("Fetch Error:", err);
                showStatus("DB Error: " + err.message, "error");
            }
        }

        // --- 6. THERMAL RENDER LOGIC ---
        function renderThermalTag(item) {
            thermalContainer.innerHTML = getTagHTML(item, 'thermal');
            
            // Generate Barcode
            setTimeout(() => {
                JsBarcode("#bc-thermal", item.barcode, {
                    format: "CODE128", lineColor: "#000", width: 1.0, height: 30, displayValue: false, margin: 0
                });
            }, 0);
        }

        function printTag() {
            window.print();
        }

        // --- 7. A4 QUEUE & RENDER LOGIC ---
        function addToQueue(item) {
            tagsQueue.push(item);
            showStatus(`Added ${item.name} (${item.size})`, "success");
            renderA4Grid();
        }

        function clearQueue() {
            if(confirm("Clear all tags?")) {
                tagsQueue = [];
                renderA4Grid();
            }
        }

        function renderA4Grid() {
            queueInfo.textContent = `Queue: ${tagsQueue.length} items`;
            a4Container.innerHTML = '';

            if (tagsQueue.length === 0) {
                a4Container.innerHTML = '<div style="padding:20px; color:#999;">Scan to populate sheet...</div>';
                return;
            }

            // Layout: 7 columns x 4 rows = 28 items per A4 page (using 1"x2.5" tags)
            const ITEMS_PER_PAGE = 28;
            const pages = Math.ceil(tagsQueue.length / ITEMS_PER_PAGE);

            for (let p = 0; p < pages; p++) {
                const start = p * ITEMS_PER_PAGE;
                const end = start + ITEMS_PER_PAGE;
                const pageItems = tagsQueue.slice(start, end);

                const pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';

                pageItems.forEach((item, index) => {
                    const globalIndex = (p * ITEMS_PER_PAGE) + index;
                    
                    // Create Cell
                    const cell = document.createElement('div');
                    cell.className = 'a4-cell';
                    
                    // Inject Unified Tag HTML (No transform needed)
                    cell.innerHTML = getTagHTML(item, `a4-${globalIndex}`);
                    
                    pageDiv.appendChild(cell);
                });

                a4Container.appendChild(pageDiv);
            }

            // Generate Barcodes for all A4 tags
            setTimeout(() => {
                tagsQueue.forEach((item, idx) => {
                    try {
                        JsBarcode(`#bc-a4-${idx}`, item.barcode, {
                            format: "CODE128",
                            lineColor: "#000",
                            width: 1.0,
                            height: 30,
                            displayValue: false,
                            margin: 0
                        });
                    } catch(e) { console.error(e); }
                });
            }, 50);
        }

        // --- 8. EVENTS ---
        barcodeInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") { e.preventDefault(); fetchData(); }
        });

        setMode('thermal');
    </script>
</body>
</html>
