<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Display Audit System</title>
    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #2563EB; --success: #10B981; --danger: #EF4444; --bg: #F3F4F6; --card: #FFFFFF; --border: #E5E7EB; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; }

        /* Header & Stats */
        header { background: var(--card); padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .stats { display: flex; gap: 2rem; }
        .stat-item { text-align: center; }
        .stat-val { font-weight: bold; font-size: 1.1rem; }
        .stat-lbl { font-size: 0.75rem; color: #666; text-transform: uppercase; }

        /* Layout Grid */
        .grid { display: grid; grid-template-columns: 300px 1fr 320px; flex: 1; overflow: hidden; }

        /* Sidebar (Styles) */
        .panel { background: var(--card); overflow-y: auto; }
        .sidebar-left { border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-right { border-left: 1px solid var(--border); padding: 1rem; }
        
        .search-area { padding: 1rem; border-bottom: 1px solid var(--border); background: #F9FAFB; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

        .list-header { padding: 1rem; font-weight: bold; border-bottom: 1px solid var(--border); background: #F9FAFB; }
        .style-item { padding: 10px 15px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; }
        .style-item:hover { background: #F3F4F6; }
        .style-item.active { background: #EFF6FF; border-left: 4px solid var(--primary); }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge.gray { background: #eee; color: #555; }
        .badge.green { background: #D1FAE5; color: #065F46; }

        /* Workspace */
        .workspace { padding: 2rem; overflow-y: auto; display: flex; justify-content: center; }
        .audit-card { width: 100%; max-width: 600px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-head { background: var(--primary); color: white; padding: 1.5rem; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; }
        .card-body { padding: 1.5rem; }
        
        .audit-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .audit-row:last-child { border-bottom: none; }
        
        /* Toggles */
        .toggle-wrap { display: flex; background: #eee; border-radius: 6px; padding: 2px; }
        .toggle-opt { padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 0.85rem; transition: 0.2s; }
        .toggle-opt.yes.active { background: var(--success); color: white; }
        .toggle-opt.no.active { background: var(--danger); color: white; }

        /* Report */
        .rep-sec { margin-bottom: 1.5rem; }
        .rep-tit { font-size: 0.8rem; font-weight: bold; color: #666; margin-bottom: 5px; text-transform: uppercase; display: flex; justify-content: space-between; }
        .rep-row { font-size: 0.85rem; display: flex; justify-content: space-between; margin-bottom: 4px; }

        /* Footer */
        footer { background: white; padding: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 0.5rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; color: white; background: var(--primary); }
        .btn:hover { background: #1D4ED8; }
        .btn.warn { background: var(--danger); }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: white; padding: 2rem; border-radius: 8px; width: 350px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:bold; font-size:1.2rem;"><i class="fa-solid fa-clipboard-check"></i> Audit System</div>
        <div class="stats">
            <div class="stat-item"><div class="stat-val" id="st-styles">0</div><div class="stat-lbl">Styles</div></div>
            <div class="stat-item"><div class="stat-val" id="st-qty">0</div><div class="stat-lbl">Total Qty</div></div>
            <div class="stat-item"><div class="stat-val" id="st-pct">0%</div><div class="stat-lbl">Done</div></div>
        </div>
    </header>

    <div class="grid">
        <!-- LEFT: Select Category & List Styles -->
        <aside class="panel sidebar-left">
            <div class="search-area">
                <div class="input-group">
                    <label style="font-size:0.8rem; font-weight:bold;">Select Category (Name)</label>
                    <input type="text" id="cat-search" list="cat-list" placeholder="Type to search...">
                    <datalist id="cat-list"></datalist>
                </div>
            </div>
            <div class="list-header">Styles</div>
            <div id="style-list"></div>
        </aside>

        <!-- CENTER: Audit Workspace -->
        <main class="workspace">
            <div id="empty-state" style="text-align:center; color:#888; margin-top:50px;">
                <i class="fa-solid fa-layer-group" style="font-size:3rem; margin-bottom:1rem; opacity:0.3;"></i>
                <h3>Select a Category</h3>
            </div>

            <div id="audit-view" class="audit-card" style="display:none;">
                <div class="card-head">
                    <h2 id="view-style">WWT-008</h2>
                    <span id="view-cat" style="background:rgba(255,255,255,0.2); padding:4px 8px; border-radius:4px; font-size:0.8rem;">Category</span>
                </div>
                <div class="card-body" id="audit-rows"></div>
            </div>
        </main>

        <!-- RIGHT: Live Report -->
        <aside class="panel sidebar-right">
            <h3 style="margin-bottom:1rem;">Live Report</h3>
            <div class="rep-sec">
                <div class="rep-tit">Unverified Styles <span id="badge-un" class="badge gray">0</span></div>
                <div id="list-un"></div>
            </div>
            <div class="rep-sec">
                <div class="rep-tit">Full Style Missing <span id="badge-fm" class="badge gray">0</span></div>
                <div id="list-fm"></div>
            </div>
            <div class="rep-sec">
                <div class="rep-tit">Color Missing <span id="badge-cm" class="badge gray">0</span></div>
                <div id="list-cm"></div>
            </div>
        </aside>
    </div>

    <footer>
        <div style="font-size:0.8rem; color:#666;">Category = Name | Qty = Balance</div>
        <button class="btn" onclick="finalAudit()">Finalize Audit</button>
    </footer>

    <!-- Modal -->
    <div id="warn-modal" class="modal">
        <div class="modal-box">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:2rem; color:#F59E0B; margin-bottom:10px;"></i>
            <h3>Warning</h3>
            <p id="warn-msg">Some styles are unaudited.</p>
            <div style="margin-top:15px; display:flex; justify-content:center;">
                <button class="btn warn" onclick="document.getElementById('warn-modal').style.display='none'">Proceed Anyway</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vrsdpyodfejjuihutgag.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc2RweW9kZmVqanVpaHV0Z2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDU1MjAsImV4cCI6MjA4MzI4MTUyMH0.lHEpLJDfeHBRWElnW11wggWr59yXSgRAff3n1ZFTeDE";
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // STATE
        const App = {
            currentCategory: null, 
            inventory: [],         // Raw inventory rows
            groupedStyles: {},     // style_code -> { items: [], colors: [], totalQty: 0 }
            auditData: {},         // inventory_id -> { displayed: bool, checked: bool }
            activeStyle: null
        };

        // 1. INIT: Load Categories (using 'name' column)
        async function init() {
            const { data } = await client.from('inventory').select('name').not('name', 'is', null);
            if(data) {
                const unique = [...new Set(data.map(d => d.name))].sort();
                const dl = document.getElementById('cat-list');
                unique.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u;
                    dl.appendChild(opt);
                });
            }
        }

        // 2. LOAD DATA when Category changes
        document.getElementById('cat-search').addEventListener('change', async (e) => {
            const catVal = e.target.value;
            if(!catVal) return;

            App.currentCategory = catVal;
            App.inventory = [];
            App.groupedStyles = {};
            App.auditData = {};
            App.activeStyle = null;

            // FETCH INVENTORY
            const { data, error } = await client
                .from('inventory')
                .select('*')
                .eq('name', catVal) 
                .gt('balance', 0);

            if(error) {
                alert("Error: " + error.message);
                return;
            }

            App.inventory = data;

            // Group by Style Code, AND THEN Group by Color inside the style
            data.forEach(item => {
                if(!App.groupedStyles[item.style_code]) {
                    App.groupedStyles[item.style_code] = { 
                        code: item.style_code, 
                        items: [],      // Keep raw items for reports/stats
                        colors: [],     // Grouped by color for UI
                        totalQty: 0 
                    };
                }
                
                const style = App.groupedStyles[item.style_code];
                style.items.push(item);
                style.totalQty += (item.balance || 0);

                // --- NEW LOGIC: Group by Color ---
                const colorName = item.color || 'N/A';
                let colorObj = style.colors.find(c => c.name === colorName);
                
                if (!colorObj) {
                    colorObj = { name: colorName, totalQty: 0, inventoryIds: [] };
                    style.colors.push(colorObj);
                }
                
                colorObj.totalQty += (item.balance || 0);
                colorObj.inventoryIds.push(item.id);
            });

            // FETCH AUDITS
            const { data: audits } = await client
                .from('display_audit')
                .select('*')
                .eq('category_name', catVal);

            if(audits) {
                audits.forEach(a => {
                    App.auditData[a.inventory_id] = {
                        displayed: a.is_displayed,
                        checked: true
                    };
                });
            }

            renderStyleList();
            updateStats();
            updateReport();
        });

        // 3. RENDER STYLE LIST
        function renderStyleList() {
            const list = document.getElementById('style-list');
            list.innerHTML = '';

            Object.keys(App.groupedStyles).sort().forEach(code => {
                const style = App.groupedStyles[code];
                // Check if any item in this style has been audited
                const isAudited = style.items.some(i => App.auditData[i.id]?.checked);

                const div = document.createElement('div');
                div.className = `style-item ${App.activeStyle === code ? 'active' : ''}`;
                div.innerHTML = `
                    <span style="font-weight:600">${code}</span>
                    <span class="badge ${isAudited ? 'green' : 'gray'}">${style.totalQty} Qty</span>
                `;
                div.onclick = () => loadStyle(code);
                list.appendChild(div);
            });
        }

        // 4. RENDER AUDIT INTERFACE (GROUPED BY COLOR)
        function loadStyle(code) {
            App.activeStyle = code;
            renderStyleList(); 

            const style = App.groupedStyles[code];
            document.getElementById('view-style').innerText = code;
            document.getElementById('view-cat').innerText = App.currentCategory;
            
            document.getElementById('audit-view').style.display = 'block';
            document.getElementById('empty-state').style.display = 'none';

            const rows = document.getElementById('audit-rows');
            rows.innerHTML = '';

            // --- NEW LOGIC: Iterate over Grouped Colors ---
            style.colors.forEach(colorObj => {
                // Check status based on the first ID in the group (or check consistency)
                // We check if ANY of the IDs in this color group are checked. 
                // Assuming if one size is checked, the color is checked.
                const firstId = colorObj.inventoryIds[0];
                const auditStatus = App.auditData[firstId];
                const statusVal = auditStatus ? auditStatus.displayed : undefined; // true, false, undefined

                const row = document.createElement('div');
                row.className = 'audit-row';
                row.innerHTML = `
                    <div>
                        <b>${colorObj.name}</b>
                        <span style="font-size:0.85rem; color:#666; margin-left:5px;">(Stock: ${colorObj.totalQty})</span>
                    </div>
                    <div class="toggle-wrap">
                        <div class="toggle-opt yes ${statusVal === true ? 'active' : ''}" onclick="saveAudit('${code}', '${colorObj.name}', true)">Yes</div>
                        <div class="toggle-opt no ${statusVal === false ? 'active' : ''}" onclick="saveAudit('${code}', '${colorObj.name}', false)">No</div>
                    </div>
                `;
                rows.appendChild(row);
            });
        }

        // 5. SAVE AUDIT ACTION (BATCH UPDATE)
        window.saveAudit = async function(styleCode, colorName, isDisplayed) {
            const style = App.groupedStyles[styleCode];
            const colorObj = style.colors.find(c => c.name === colorName);

            // --- NEW LOGIC: Loop through ALL IDs for this color ---
            if(colorObj) {
                colorObj.inventoryIds.forEach(id => {
                    // Update Local State
                    App.auditData[id] = { displayed: isDisplayed, checked: true };
                });

                // Refresh UI
                loadStyle(styleCode);
                updateStats();
                updateReport();

                // Batch Update DB
                // Note: In a real high-perf app, use an RPC or batch insert. Here we loop for simplicity.
                for (const id of colorObj.inventoryIds) {
                    const item = App.inventory.find(i => i.id === id);
                    if(item) {
                        await client.from('display_audit').upsert({
                            inventory_id: id,
                            style_code: item.style_code,
                            color: item.color,
                            category_name: item.name,
                            is_displayed: isDisplayed,
                            audit_status: 'checked'
                        }, { onConflict: 'inventory_id' });
                    }
                }
            }
        };

        // 6. UPDATE STATS
        function updateStats() {
            const codes = Object.keys(App.groupedStyles);
            document.getElementById('st-styles').innerText = codes.length;
            document.getElementById('st-qty').innerText = App.inventory.reduce((a,b) => a + (b.balance||0), 0);

            const checked = codes.filter(c => App.groupedStyles[c].items.some(i => App.auditData[i.id]?.checked)).length;
            document.getElementById('st-pct').innerText = codes.length ? Math.round((checked/codes.length)*100) + '%' : '0%';
        }

        // 7. UPDATE REPORT
        function updateReport() {
            const lUn = document.getElementById('list-un');
            const lFm = document.getElementById('list-fm');
            const lCm = document.getElementById('list-cm');
            lUn.innerHTML = lFm.innerHTML = lCm.innerHTML = '';
            
            let cUn=0, cFm=0, cCm=0;

            Object.keys(App.groupedStyles).forEach(code => {
                const style = App.groupedStyles[code];

                // 1. Unverified (based on raw items)
                if(!style.items.some(i => App.auditData[i.id]?.checked)) {
                    cUn++;
                    lUn.innerHTML += `<div class="rep-row"><span>${code}</span><b>${style.totalQty}</b></div>`;
                    return; 
                }

                // 2. Audited checks (based on raw items)
                let hasDisplay = false;
                style.items.forEach(i => {
                    const st = App.auditData[i.id];
                    if(st?.displayed === false) {
                        cCm++;
                        lCm.innerHTML += `<div class="rep-row"><span>${code} (${i.color})</span><b>${i.balance}</b></div>`;
                    }
                    if(st?.displayed === true) hasDisplay = true;
                });

                if(!hasDisplay) {
                    cFm++;
                    lFm.innerHTML += `<div class="rep-row"><span>${code}</span><b>${style.totalQty}</b></div>`;
                }
            });

            document.getElementById('badge-un').innerText = cUn;
            document.getElementById('badge-fm').innerText = cFm;
            document.getElementById('badge-cm').innerText = cCm;
            App.unverifiedCount = cUn;
        }

        window.finalAudit = function() {
            if(App.unverifiedCount > 0) {
                document.getElementById('warn-msg').innerText = `${App.unverifiedCount} styles are not audited. Proceed?`;
                document.getElementById('warn-modal').style.display = 'flex';
            } else {
                alert("Audit Finalized Successfully!");
            }
        }

        init();
    </script>
</body>
</html>
