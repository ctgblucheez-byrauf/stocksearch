<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Search Tool</title>
    
    <!-- Supabase JS Library via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts for a professional look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --error-color: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem;
            min-height: 100vh;
        }

        /* Layout Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-secondary);
        }

        /* Search Card */
        .card {
            background: var(--card-bg);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .search-form {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1.8rem; /* Align with input box considering label height */
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Status Messages */
        .status-message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            display: none; /* Hidden by default */
        }
        
        .status-error {
            background-color: #fef2f2;
            color: var(--error-color);
            border: 1px solid #fecaca;
            display: block;
        }

        .status-loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Results Table */
        .results-section {
            background: var(--card-bg);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            overflow: hidden; /* For rounded corners on table */
            border: 1px solid var(--border-color);
            display: none; /* Hidden until results arrive */
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px; /* Prevent squishing on small screens */
        }

        thead {
            background-color: #f9fafb;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            padding: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.925rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        /* Empty State */
        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-secondary);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Helper utilities */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Responsive tweaks */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .search-form {
                flex-direction: column;
                align-items: stretch;
            }
            button {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Inventory Lookup</h1>
            <p class="subtitle">Search items by Style Code</p>
        </header>

        <main>
            <!-- Search Section -->
            <section class="card">
                <form id="searchForm" class="search-form">
                    <div class="input-group">
                        <label for="styleCodeInput">Style Code</label>
                        <input 
                            type="text" 
                            id="styleCodeInput" 
                            name="styleCode" 
                            placeholder="e.g., 1023, AB-20..." 
                            autocomplete="off"
                            required
                        >
                    </div>
                    <button type="submit" id="searchBtn">
                        <span id="btnText">Search</span>
                        <div id="btnSpinner" class="spinner hidden"></div>
                    </button>
                </form>

                <!-- Status/Error Area -->
                <div id="statusArea"></div>
            </section>

            <!-- Results Section -->
            <section id="resultsSection" class="results-section">
                <div class="table-container">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>Barcode</th>
                                <th>Style code</th>
                                <th>Item code</th>
                                <th>Item name</th>
                                <th>Clour</th>
                                <th>Balance</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows will be injected here via JS -->
                        </tbody>
                    </table>
                </div>
                <!-- Empty/No Results State -->
                <div id="emptyState" class="empty-state hidden">
                    <p>No items found matching this Style Code.</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        // --- CONFIGURATION ---
        
        // Supabase Credentials
        const SUPABASE_URL = 'https://vrsdpyodfejjuihutgag.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc2RweW9kZmVqanVpaHV0Z2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDU1MjAsImV4cCI6MjA4MzI4MTUyMH0.lHEpLJDfeHBRWElnW11wggWr59yXSgRAff3n1ZFTeDE';

        // !!! IMPORTANT: TABLE NAME UPDATED TO 'dis product' !!!
        const TABLE_NAME = 'dis product'; 

        // --- APP LOGIC ---

        // Initialize Supabase Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // DOM Elements
        const searchForm = document.getElementById('searchForm');
        const styleCodeInput = document.getElementById('styleCodeInput');
        const searchBtn = document.getElementById('searchBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const statusArea = document.getElementById('statusArea');
        const resultsSection = document.getElementById('resultsSection');
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');

        // Helper: Show Status Message (Error or Loading)
        function showStatus(message, type = 'loading') {
            statusArea.innerHTML = '';
            
            if (type === 'loading') {
                statusArea.className = 'status-message status-loading';
                statusArea.innerHTML = `<div class="spinner"></div> <span>${message}</span>`;
                statusArea.style.display = 'flex';
            } else if (type === 'error') {
                statusArea.className = 'status-message status-error';
                statusArea.innerHTML = `<span><strong>Error:</strong> ${message}</span>`;
                statusArea.style.display = 'block';
                // Auto hide error after 5 seconds
                setTimeout(() => { statusArea.style.display = 'none'; }, 5000);
            } else {
                statusArea.style.display = 'none';
            }
        }

        // Helper: Set Loading State on Button
        function setLoading(isLoading) {
            if (isLoading) {
                searchBtn.disabled = true;
                btnText.textContent = 'Searching...';
                btnSpinner.classList.remove('hidden');
                showStatus('Querying database...', 'loading');
            } else {
                searchBtn.disabled = false;
                btnText.textContent = 'Search';
                btnSpinner.classList.add('hidden');
                statusArea.style.display = 'none';
            }
        }

        // Helper: Render Table Rows
        function renderTable(data) {
            tableBody.innerHTML = ''; // Clear existing rows

            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            data.forEach(row => {
                const tr = document.createElement('tr');
                
                // Accessing columns exactly as requested. 
                // Note: We check if the key exists to avoid errors, 
                // though Supabase usually returns all columns or null.
                const columns = [
                    'Barcode', 
                    'Style code', 
                    'Item code', 
                    'Item name', 
                    'Clour', 
                    'Balance'
                ];

                columns.forEach(col => {
                    const td = document.createElement('td');
                    // Get value, default to empty string if undefined
                    const val = row[col] !== undefined ? row[col] : '';
                    
                    // Simple logic to highlight Balance if it's low or high (optional visualization)
                    if (col === 'Balance' && val !== '') {
                        td.style.fontWeight = '600';
                        td.style.color = '#059669'; // Green text for numbers
                    }
                    
                    td.textContent = val;
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });
        }

        // Main Search Function
        async function handleSearch(e) {
            e.preventDefault(); // Prevent form submission refresh
            const searchTerm = styleCodeInput.value.trim();

            if (!searchTerm) {
                showStatus('Please enter a style code.', 'error');
                return;
            }

            setLoading(true);
            resultsSection.style.display = 'none'; // Hide results while loading

            try {
                // Query Supabase
                // We use .ilike() for case-insensitive partial matching (e.g. "102" finds "102-A")
                const { data, error } = await supabase
                    .from(TABLE_NAME)
                    .select('*')
                    .ilike('Style code', `%${searchTerm}%`);

                if (error) throw error;

                // Render Results
                resultsSection.style.display = 'block';
                renderTable(data || []);

            } catch (err) {
                console.error('Supabase Error:', err);
                
                // Friendly error messages
                let userMessage = err.message;
                if (err.code === '42P01') { // Postgres code for relation not found
                    userMessage = `Table "${TABLE_NAME}" not found. Please check the table name in your Supabase dashboard.`;
                }
                
                showStatus(userMessage, 'error');
                resultsSection.style.display = 'none';
            } finally {
                setLoading(false);
            }
        }

        // Event Listeners
        searchForm.addEventListener('submit', handleSearch);

    </script>
</body>
</html>
