<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search Tool</title>
    
    <!-- 1. Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* CSS STYLES */
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem;
            margin: 0;
        }

        .container { max-width: 1100px; margin: 0 auto; }
        
        h1 { text-align: center; margin-bottom: 2rem; }

        .search-box {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .input-group { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-weight: 600; color: #64748b; font-size: 0.9rem; }
        
        input {
            padding: 0.8rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus { border-color: var(--primary); outline: none; }

        button {
            padding: 0.8rem 2rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { background-color: #cbd5e1; cursor: wait; }

        .status { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
        .error { background-color: #fee2e2; color: #ef4444; }

        .results {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            overflow: hidden;
            display: none;
        }

        table { width: 100%; border-collapse: collapse; }
        thead { background-color: #f8fafc; border-bottom: 2px solid var(--border); }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 700; color: #475569; text-transform: uppercase; font-size: 0.85rem; }
        tr:last-child td { border-bottom: none; }
        .empty { padding: 2rem; text-align: center; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Inventory Lookup</h1>

        <div class="search-box">
            <div class="input-group">
                <label for="searchInput">Style Code</label>
                <input type="text" id="searchInput" placeholder="Type here...">
            </div>
            <button id="btnSearch">Search</button>
        </div>

        <div id="statusArea" class="status"></div>

        <div class="results" id="resultsTable">
            <table>
                <thead>
                    <tr>
                        <th>Barcode</th>
                        <th>Style code</th>
                        <th>name</th>
                        <th>colour</th>
                        <th>balance</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div id="emptyMsg" class="empty" style="display:none;">No items found.</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const URL = 'https://vrsdpyodfejjuihutgag.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc2RweW9kZmVqanVpaHV0Z2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDU1MjAsImV4cCI6MjA4MzI4MTUyMH0.lHEpLJDfeHBRWElnW11wggWr59yXSgRAff3n1ZFTeDE';
        const TABLE = 'dis product';

        // --- INITIALIZE SUPABASE (ONLY ONCE) ---
        const supabase = window.supabase.createClient(URL, KEY);

        // --- VARIABLES ---
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('btnSearch');
        const resultsDiv = document.getElementById('resultsTable');
        const tbody = document.getElementById('tableBody');
        const statusDiv = document.getElementById('statusArea');
        const emptyDiv = document.getElementById('emptyMsg');

        // --- COLUMNS TO SHOW ---
        const COLS = ['Barcode', 'Style code', 'name', 'colour', 'balance'];

        // --- SEARCH FUNCTION ---
        async function search() {
            const val = input.value.trim();
            if (!val) return alert('Please enter a style code');

            btn.disabled = true;
            btn.textContent = 'Loading...';
            resultsDiv.style.display = 'none';
            statusDiv.style.display = 'none';

            try {
                const { data, error } = await supabase
                    .from(TABLE)
                    .select('*')
                    .ilike('Style code', `%${val}%`);

                if (error) throw error;
                render(data);

            } catch (err) {
                statusDiv.textContent = 'Error: ' + err.message;
                statusDiv.classList.add('error');
                statusDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Search';
            }
        }

        // --- RENDER FUNCTION ---
        function render(data) {
            tbody.innerHTML = '';
            resultsDiv.style.display = 'block';

            if (!data || data.length === 0) {
                emptyDiv.style.display = 'block';
                return;
            }
            emptyDiv.style.display = 'none';

            data.forEach(row => {
                const tr = document.createElement('tr');
                COLS.forEach(col => {
                    const td = document.createElement('td');
                    td.textContent = row[col] !== undefined ? row[col] : '';
                    if (col === 'balance') td.style.fontWeight = 'bold';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        // --- EVENTS ---
        btn.addEventListener('click', search);
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') search(); });

    </script>
<!-- DO NOT ADD ANYTHING BELOW THIS LINE -->
</body>
</html>
