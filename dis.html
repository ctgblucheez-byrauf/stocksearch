<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search Tool</title>
    
    <!-- Supabase JS Library via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #334155;
        }

        /* Search Card */
        .search-card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            margin-bottom: 2rem;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
        }

        input {
            padding: 0.8rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 0.8rem 2rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: wait;
        }

        /* Status Messages */
        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }
        .error { background-color: #fee2e2; color: #ef4444; }
        .loading { color: #64748b; font-weight: 500; }

        /* Results Table */
        .results-container {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: none; /* Hidden by default */
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #f8fafc;
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 1rem;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            color: #334155;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f8fafc; }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: #94a3b8;
        }

        /* Mobile Responsive */
        @media (max-width: 640px) {
            .search-card { flex-direction: column; align-items: stretch; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Inventory Lookup</h1>

        <div class="search-card">
            <div class="input-group">
                <label for="styleCode">Search Style Code</label>
                <input type="text" id="styleCode" placeholder="e.g. 1001, AB-20..." autocomplete="off">
            </div>
            <button id="searchBtn">Search</button>
        </div>

        <div id="statusArea" class="status"></div>

        <div class="results-container" id="resultsArea">
            <table>
                <thead>
                    <tr>
                        <th>Barcode</th>
                        <th>Style code</th>
                        <th>name</th>
                        <th>colour</th>
                        <th>balance</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows injected here -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state hidden">No results found.</div>
        </div>
    </div>

    <!-- SINGLE SCRIPT BLOCK STARTS HERE -->
    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://vrsdpyodfejjuihutgag.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc2RweW9kZmVqanVpaHV0Z2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDU1MjAsImV4cCI6MjA4MzI4MTUyMH0.lHEpLJDfeHBRWElnW11wggWr59yXSgRAff3n1ZFTeDE';
        const TABLE_NAME = 'dis product';

        // --- INITIALIZE CLIENT (ONLY ONCE) ---
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- DOM ELEMENTS ---
        const styleCodeInput = document.getElementById('styleCode');
        const searchBtn = document.getElementById('searchBtn');
        const resultsArea = document.getElementById('resultsArea');
        const tableBody = document.getElementById('tableBody');
        const statusArea = document.getElementById('statusArea');
        const emptyState = document.getElementById('emptyState');

        // Columns to render
        const COLUMNS = ['Barcode', 'Style code', 'name', 'colour', 'balance'];

        // --- FUNCTIONS ---

        function showStatus(msg, type) {
            statusArea.textContent = msg;
            statusArea.className = `status ${type}`;
            statusArea.style.display = 'block';
        }

        async function handleSearch() {
            const query = styleCodeInput.value.trim();

            if (!query) {
                showStatus("Please enter a style code.", "error");
                return;
            }

            // UI State: Loading
            searchBtn.disabled = true;
            searchBtn.textContent = "Searching...";
            resultsArea.style.display = 'none';
            showStatus("Connecting to database...", "loading");

            try {
                // Query Supabase
                // Searching in 'Style code' column
                const { data, error } = await supabase
                    .from(TABLE_NAME)
                    .select('*')
                    .ilike('Style code', `%${query}%`);

                if (error) throw error;

                renderTable(data);
                showStatus("", ""); // Clear status

            } catch (err) {
                console.error(err);
                showStatus(`Error: ${err.message}`, "error");
                resultsArea.style.display = 'none';
            } finally {
                // UI State: Reset
                searchBtn.disabled = false;
                searchBtn.textContent = "Search";
            }
        }

        function renderTable(data) {
            tableBody.innerHTML = ''; // Clear table
            resultsArea.style.display = 'block';

            if (!data || data.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            data.forEach(row => {
                const tr = document.createElement('tr');

                COLUMNS.forEach(col => {
                    const td = document.createElement('td');
                    const val = (row[col] !== undefined) ? row[col] : '';
                    
                    if (col === 'balance') {
                        td.style.fontWeight = 'bold';
                        td.style.color = '#0d9488';
                    }
                    
                    td.textContent = val;
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });
        }

        // --- EVENT LISTENERS ---
        searchBtn.addEventListener('click', handleSearch);
        styleCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

    </script>
    <!-- SINGLE SCRIPT BLOCK ENDS HERE -->
</body>
</html>
