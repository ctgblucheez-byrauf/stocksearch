<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Fast, lightweight mobile barcode scanner">
    <title>ScanFlow</title>
    <link rel="manifest" id="pwa-manifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --accent:#00e5a0;--accent-glow:rgba(0,229,160,0.35);--accent-dim:rgba(0,229,160,0.1);
            --surface:rgba(10,10,10,0.88);--text:#f0f0f0;--text-sec:#777;
            --danger:#ff4757;--border:rgba(255,255,255,0.08);
            --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
        }
        html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);
            font-family:'Space Grotesk',system-ui,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

        /* Screens */
        .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
            justify-content:center;z-index:100;transition:opacity .3s,visibility .3s}
        .screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
        #loading-screen{background:#000}
        #permission-screen,#error-screen{background:#000;gap:20px;padding:32px;text-align:center}
        .loader{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);
            border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .screen-icon{width:64px;height:64px;margin-bottom:8px;opacity:.7}
        .screen-title{font-size:22px;font-weight:700;line-height:1.3}
        .screen-desc{font-size:14px;color:var(--text-sec);line-height:1.5;max-width:300px}

        /* Buttons */
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;
            border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;
            cursor:pointer;transition:all .15s;outline:none}
        .btn:focus-visible{box-shadow:0 0 0 3px var(--accent-glow)}
        .btn-primary{background:var(--accent);color:#000}
        .btn-primary:active{transform:scale(.96);filter:brightness(.9)}
        .btn-ghost{background:rgba(255,255,255,.08);color:var(--text)}
        .btn-ghost:active{background:rgba(255,255,255,.14)}
        .btn-icon{width:48px;height:48px;padding:0;border-radius:14px;background:rgba(255,255,255,.1);
            border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;
            justify-content:center;transition:all .2s;font-size:0}
        .btn-icon:active{background:rgba(255,255,255,.18);transform:scale(.92)}
        .btn-icon.active{background:var(--accent-dim);border-color:rgba(0,229,160,.3);color:var(--accent)}
        .btn-icon svg{width:22px;height:22px}

        /* Scanner View */
        #scanner-view{position:fixed;inset:0;display:flex;flex-direction:column;
            opacity:0;visibility:hidden;transition:opacity .4s}
        #scanner-view.active{opacity:1;visibility:visible}
        #camera-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
        #scan-canvas{display:none}

        /* Scan Overlay */
        #scan-overlay{position:absolute;inset:0;z-index:2;pointer-events:none}
        #scan-region{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
            width:min(78vw,300px);height:min(32vh,170px);
            box-shadow:0 0 0 9999px rgba(0,0,0,.55);transition:box-shadow .3s}
        #scan-region.detected{box-shadow:0 0 0 9999px rgba(0,0,0,.3),0 0 30px var(--accent-glow)}
        .corner{position:absolute;width:24px;height:24px;border-color:var(--accent);border-style:solid;border-width:0}
        .corner.tl{top:-1px;left:-1px;border-top-width:3px;border-left-width:3px;border-top-left-radius:6px}
        .corner.tr{top:-1px;right:-1px;border-top-width:3px;border-right-width:3px;border-top-right-radius:6px}
        .corner.bl{bottom:-1px;left:-1px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:6px}
        .corner.br{bottom:-1px;right:-1px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:6px}
        #scan-line{position:absolute;left:8px;right:8px;height:2px;
            background:linear-gradient(90deg,transparent 0%,var(--accent) 30%,var(--accent) 70%,transparent 100%);
            box-shadow:0 0 12px var(--accent-glow),0 0 4px var(--accent-glow);
            animation:scan-move 2.5s ease-in-out infinite;opacity:0;transition:opacity .3s}
        #scan-line.active{opacity:1}
        @keyframes scan-move{0%,100%{top:8%}50%{top:88%}}

        /* Top Bar */
        #top-bar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;
            align-items:center;justify-content:space-between;
            padding:calc(12px + var(--safe-t)) 16px 12px;
            background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent)}
        .mode-badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;
            letter-spacing:.6px;text-transform:uppercase;background:var(--accent-dim);color:var(--accent);
            border:1px solid rgba(0,229,160,.2);transition:all .2s}
        .top-actions{display:flex;gap:8px}

        /* Bottom Controls */
        #bottom-controls{position:absolute;bottom:0;left:0;right:0;z-index:10;
            display:flex;align-items:center;justify-content:space-around;
            padding:16px 24px calc(20px + var(--safe-b));
            background:linear-gradient(to top,rgba(0,0,0,.7),transparent)}
        #scan-toggle{width:64px;height:64px;border-radius:50%;border:3px solid var(--accent);
            background:transparent;color:var(--accent);cursor:pointer;display:flex;
            align-items:center;justify-content:center;transition:all .25s;font-size:0}
        #scan-toggle:active{transform:scale(.9)}
        #scan-toggle.scanning{background:var(--danger);border-color:var(--danger);color:#fff}
        #scan-toggle svg{width:24px;height:24px;fill:currentColor;stroke:none}

        /* Result Panel */
        #result-panel{position:absolute;bottom:0;left:0;right:0;z-index:20;
            padding:20px 20px calc(24px + var(--safe-b));background:var(--surface);
            backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border-top:1px solid var(--border);border-radius:20px 20px 0 0;
            transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);pointer-events:auto}
        #result-panel.visible{transform:translateY(0)}
        .result-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 16px}
        .result-format{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;
            font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:var(--accent-dim);
            color:var(--accent);margin-bottom:8px}
        .result-text{font-size:19px;font-weight:700;word-break:break-all;line-height:1.4;margin-bottom:16px}
        .result-actions{display:flex;gap:10px}
        .result-actions .btn{flex:1;padding:12px 16px;font-size:14px}

        /* History Panel */
        #history-panel{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            transform:translateX(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);
            display:flex;flex-direction:column;overflow:hidden}
        #history-panel.open{transform:translateX(0)}
        .history-header{display:flex;align-items:center;justify-content:space-between;
            padding:calc(16px + var(--safe-t)) 20px 16px;border-bottom:1px solid var(--border)}
        .history-header h2{font-size:20px;font-weight:700}
        .history-list{flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}
        .history-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;
            background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:8px;
            transition:background .15s}
        .history-item:active{background:rgba(255,255,255,.08)}
        .history-item-info{flex:1;min-width:0}
        .history-item-text{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .history-item-meta{font-size:12px;color:var(--text-sec);margin-top:2px}
        .history-empty{text-align:center;padding:60px 20px;color:var(--text-sec)}
        .history-empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.3}
        .hdr-btns{display:flex;gap:8px}

        /* Manual Input Modal */
        #manual-modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;
            justify-content:center;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:all .25s}
        #manual-modal.open{opacity:1;visibility:visible}
        .modal-content{width:100%;max-width:480px;padding:24px 20px calc(24px + var(--safe-b));
            background:#111;border-radius:20px 20px 0 0;
            transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
        #manual-modal.open .modal-content{transform:translateY(0)}
        .modal-content h3{font-size:18px;font-weight:700;margin-bottom:16px}
        .input-row{display:flex;gap:10px}
        .input-row input{flex:1;padding:14px 16px;border:1px solid var(--border);border-radius:12px;
            background:rgba(255,255,255,.06);color:var(--text);font-family:inherit;font-size:16px;
            outline:none;transition:border-color .2s}
        .input-row input:focus{border-color:var(--accent)}
        .input-row input::placeholder{color:var(--text-sec)}

        /* Toast */
        #toast{position:fixed;top:calc(20px + var(--safe-t));left:50%;
            transform:translateX(-50%) translateY(-120%);z-index:200;padding:12px 24px;
            border-radius:12px;background:var(--surface);backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);border:1px solid var(--border);
            font-size:14px;font-weight:600;white-space:nowrap;
            transition:transform .3s cubic-bezier(.32,.72,0,1)}
        #toast.show{transform:translateX(-50%) translateY(0)}

        /* Animations */
        @keyframes fade-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .fade-in{animation:fade-in .4s ease both}

        @media(prefers-reduced-motion:reduce){
            #scan-line{animation:none}
            .loader{animation-duration:2s}
            *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
        }
        @media(max-width:360px){
            #scan-region{width:86vw;height:26vh}
            .corner{width:18px;height:18px}
            .result-text{font-size:17px}
            #scan-toggle{width:56px;height:56px}
        }
        .history-list::-webkit-scrollbar{width:4px}
        .history-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen" class="screen">
        <div class="loader"></div>
    </div>

    <!-- Permission Screen -->
    <div id="permission-screen" class="screen hidden">
        <svg class="screen-icon" viewBox="0 0 64 64" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round">
            <rect x="10" y="18" width="44" height="32" rx="4"/><circle cx="32" cy="34" r="8"/><path d="M26 18v-4a6 6 0 0112 0v4"/>
        </svg>
        <h1 class="screen-title">Camera Access Required</h1>
        <p class="screen-desc">ScanFlow needs access to your camera to scan barcodes. Everything is processed on-device — your video feed never leaves your phone.</p>
        <button class="btn btn-primary" id="grant-permission-btn">Allow Camera</button>
    </div>

    <!-- Error Screen -->
    <div id="error-screen" class="screen hidden">
        <svg class="screen-icon" viewBox="0 0 64 64" fill="none" stroke="var(--danger)" stroke-width="2.5" stroke-linecap="round">
            <circle cx="32" cy="32" r="24"/><path d="M22 22l20 20M42 22L22 42"/>
        </svg>
        <h1 class="screen-title" id="error-title">Something Went Wrong</h1>
        <p class="screen-desc" id="error-desc">An unexpected error occurred. Please try again.</p>
        <button class="btn btn-primary" id="retry-btn">Retry</button>
    </div>

    <!-- Main Scanner View -->
    <section id="scanner-view" aria-label="Barcode scanner">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="scan-canvas"></canvas>

        <div id="scan-overlay">
            <div id="scan-region">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <div id="scan-line"></div>
            </div>
        </div>

        <header id="top-bar">
            <div class="mode-badge" id="mode-badge">Continuous</div>
            <div class="top-actions">
                <button class="btn-icon" id="manual-btn" aria-label="Manual input" title="Manual input">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h12M6 14h8"/>
                    </svg>
                </button>
                <button class="btn-icon" id="history-btn" aria-label="Scan history" title="History">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
                    </svg>
                </button>
            </div>
        </header>

        <nav id="bottom-controls" aria-label="Scanner controls">
            <button class="btn-icon" id="flash-btn" aria-label="Toggle flashlight" title="Flashlight">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 2L7 14h5l-2 8 6-12h-5l2-8z"/>
                </svg>
            </button>
            <button class="btn-icon" id="mode-btn" aria-label="Toggle scan mode" title="Scan mode">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12a8 8 0 0114-5M20 12a8 8 0 01-14 5"/><path d="M17 3v5h-5M7 21v-5h5"/>
                </svg>
            </button>
            <button id="scan-toggle" aria-label="Start scanning">
                <svg id="icon-play" viewBox="0 0 24 24"><polygon points="8,4 20,12 8,20"/></svg>
                <svg id="icon-stop" viewBox="0 0 24 24" style="display:none"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
            </button>
            <div style="width:48px"></div>
            <div style="width:48px"></div>
        </nav>

        <div id="result-panel" role="alert">
            <div class="result-handle"></div>
            <div class="result-format" id="result-format">EAN-13</div>
            <div class="result-text" id="result-text">-</div>
            <div class="result-actions">
                <button class="btn btn-primary" id="copy-btn">Copy</button>
                <button class="btn btn-ghost" id="scan-again-btn">Scan Again</button>
            </div>
        </div>
    </section>

    <!-- History Panel -->
    <aside id="history-panel" aria-label="Scan history">
        <div class="history-header">
            <h2>History</h2>
            <div class="hdr-btns">
                <button class="btn-icon" id="clear-history-btn" aria-label="Clear all history" title="Clear all" style="width:40px;height:40px">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
                        <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/>
                    </svg>
                </button>
                <button class="btn-icon" id="close-history-btn" aria-label="Close history" title="Close" style="width:40px;height:40px">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
        </div>
        <div class="history-list" id="history-list"></div>
    </aside>

    <!-- Manual Input Modal -->
    <div id="manual-modal" role="dialog" aria-label="Manual barcode input">
        <div class="modal-content">
            <h3>Enter Barcode Manually</h3>
            <div class="input-row">
                <input type="text" id="manual-input" placeholder="Type or paste barcode value..." autocomplete="off" inputmode="numeric">
                <button class="btn btn-primary" id="manual-submit-btn" style="padding:14px 20px">Add</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- ZXing Library -->
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

    <script>
    /* ================================================================
       ScanFlow — High-Performance Mobile Barcode Scanner
       Single-file, zero-dependency (except ZXing CDN)
       ================================================================ */

    // ===== Configuration =====
    const CONFIG = {
        SCAN_INTERVAL: 250,
        DECODE_WIDTH: 360,
        DUPLICATE_WINDOW: 2000,
        RESULT_AUTO_HIDE: 4000,
        WORKER_TIMEOUT: 6000,
        ZXING_CDN: 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
        HISTORY_KEY: 'scanflow_history',
        MAX_HISTORY: 200
    };

    const FORMAT_NAMES = {
        EAN_13:'EAN-13', EAN_8:'EAN-8', UPC_A:'UPC-A', UPC_E:'UPC-E',
        CODE_128:'Code 128', CODE_39:'Code 39', CODE_93:'Code 93',
        QR_CODE:'QR Code', DATA_MATRIX:'Data Matrix', PDF_417:'PDF 417',
        AZTEC:'Aztec', ITF:'ITF', CODABAR:'Codabar'
    };

    // ===== Application State =====
    const state = {
        scanning: false,
        mode: 'continuous',
        flashOn: false,
        lastText: '',
        lastTime: 0,
        resultTimer: null,
        scanTimer: null,
        cameraStream: null,
        worker: null,
        useWorker: false,
        paused: false
    };

    // ===== DOM References =====
    const $ = (s) => document.querySelector(s);
    const dom = {
        loadingScreen:    $('#loading-screen'),
        permissionScreen: $('#permission-screen'),
        errorScreen:      $('#error-screen'),
        errorTitle:       $('#error-title'),
        errorDesc:        $('#error-desc'),
        scannerView:      $('#scanner-view'),
        video:            $('#camera-video'),
        canvas:           $('#scan-canvas'),
        scanRegion:       $('#scan-region'),
        scanLine:         $('#scan-line'),
        scanToggle:       $('#scan-toggle'),
        iconPlay:         $('#icon-play'),
        iconStop:         $('#icon-stop'),
        flashBtn:         $('#flash-btn'),
        modeBtn:          $('#mode-btn'),
        modeBadge:        $('#mode-badge'),
        manualBtn:        $('#manual-btn'),
        historyBtn:       $('#history-btn'),
        resultPanel:      $('#result-panel'),
        resultFormat:     $('#result-format'),
        resultText:       $('#result-text'),
        copyBtn:          $('#copy-btn'),
        scanAgainBtn:     $('#scan-again-btn'),
        historyPanel:     $('#history-panel'),
        historyList:      $('#history-list'),
        closeHistoryBtn:  $('#close-history-btn'),
        clearHistoryBtn:  $('#clear-history-btn'),
        manualModal:      $('#manual-modal'),
        manualInput:      $('#manual-input'),
        manualSubmitBtn:  $('#manual-submit-btn'),
        toast:            $('#toast'),
        grantPermBtn:     $('#grant-permission-btn'),
        retryBtn:         $('#retry-btn')
    };

    // ===== Screen Management =====
    function showScreen(name) {
        ['loadingScreen', 'permissionScreen', 'errorScreen'].forEach((k) => {
            dom[k].classList.toggle('hidden', k !== name);
        });
    }

    // ===== Toast Notification =====
    let toastTimer = null;
    function showToast(msg, duration) {
        duration = duration || 2000;
        clearTimeout(toastTimer);
        dom.toast.textContent = msg;
        dom.toast.classList.add('show');
        toastTimer = setTimeout(function() {
            dom.toast.classList.remove('show');
        }, duration);
    }

    // ===== Audio Beep via Web Audio API =====
    let audioCtx = null;
    function playBeep() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) { /* Audio not supported */ }
    }

    // ===== PWA Setup (Dynamic Manifest + Service Worker) =====
    function setupPWA() {
        var iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
            '<rect width="512" height="512" rx="80" fill="#000"/>' +
            '<path d="M140 220v-52a36 36 0 0136-36h52M140 292v52a36 36 0 0036 36h52M372 220v-52a36 36 0 00-36-36h-52M372 292v52a36 36 0 01-36 36h-52" stroke="#00e5a0" stroke-width="20" fill="none" stroke-linecap="round"/>' +
            '<rect x="196" y="236" width="120" height="40" rx="6" stroke="#00e5a0" stroke-width="16" fill="none"/>' +
            '</svg>';
        var iconDataUri = 'data:image/svg+xml;base64,' + btoa(iconSvg);

        var manifest = {
            name: 'ScanFlow Barcode Scanner',
            short_name: 'ScanFlow',
            start_url: '.',
            display: 'standalone',
            background_color: '#000000',
            theme_color: '#000000',
            icons: [{ src: iconDataUri, sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }]
        };
        var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        $('#pwa-manifest').href = URL.createObjectURL(blob);

        // Service worker (blob-based, may be blocked by some browsers)
        if ('serviceWorker' in navigator) {
            try {
                var swCode =
                    "var CACHE='scanflow-v1';" +
                    "var ASSETS=['./','" + CONFIG.ZXING_CDN + "'];" +
                    "self.addEventListener('install',function(e){e.waitUntil(caches.open(CACHE).then(function(c){return c.addAll(ASSETS)}));self.skipWaiting()});" +
                    "self.addEventListener('activate',function(e){e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k!==CACHE}).map(function(k){return caches.delete(k)}))}));self.clients.claim()});" +
                    "self.addEventListener('fetch',function(e){e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request).catch(function(){return caches.match('./')})}))});";
                var swBlob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});
            } catch (e) { /* Expected on many browsers */ }
        }
    }

    // ===== Camera Management =====
    function initCamera() {
        return new Promise(function(resolve, reject) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                reject(new Error('CAMERA_UNSUPPORTED'));
                return;
            }
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: 'environment' },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            }).then(function(stream) {
                state.cameraStream = stream;
                dom.video.srcObject = stream;
                dom.video.onloadedmetadata = function() {
                    dom.video.play().then(resolve).catch(reject);
                };
                dom.video.onerror = function() {
                    reject(new Error('VIDEO_ERROR'));
                };
                setTimeout(function() { reject(new Error('VIDEO_TIMEOUT')); }, 8000);
            }).catch(reject);
        });
    }

    function stopCamera() {
        if (state.cameraStream) {
            state.cameraStream.getTracks().forEach(function(t) { t.stop(); });
            state.cameraStream = null;
        }
        dom.video.srcObject = null;
    }

    // ===== Flashlight (Torch) Toggle =====
    function toggleFlash() {
        if (!state.cameraStream) return;
        var track = state.cameraStream.getVideoTracks()[0];
        if (!track) return;
        state.flashOn = !state.flashOn;
        track.applyConstraints({
            advanced: [{ torch: state.flashOn }]
        }).then(function() {
            dom.flashBtn.classList.toggle('active', state.flashOn);
        }).catch(function() {
            state.flashOn = false;
            dom.flashBtn.classList.remove('active');
            showToast('Flashlight not available');
        });
    }

    // ===== Web Worker Initialization =====
    function initWorker() {
        return new Promise(function(resolve) {
            try {
                var code =
                    "importScripts('" + CONFIG.ZXING_CDN + "');" +
                    "var reader=null;" +
                    "var hints=new Map();" +
                    "hints.set(ZXing.DecodeHintType.TRY_HARDER,true);" +
                    "self.onmessage=function(e){" +
                        "var d=e.data;" +
                        "if(d.type==='init'){" +
                            "try{reader=new ZXing.MultiFormatReader();reader.setHints(hints);self.postMessage({type:'ready'})}" +
                            "catch(err){self.postMessage({type:'error',msg:err.message})}" +
                            "return" +
                        "}" +
                        "if(d.type==='decode'&&reader){" +
                            "try{" +
                                "var src=new ZXing.RGBLuminanceSource(d.width,d.height,d.data);" +
                                "var bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));" +
                                "var result=reader.decode(bmp);" +
                                "self.postMessage({type:'result',success:true,text:result.getText(),format:result.getBarcodeFormat().toString()})" +
                            "}catch(err){self.postMessage({type:'result',success:false})}" +
                        "}" +
                    "};";
                var blob = new Blob([code], { type: 'application/javascript' });
                var w = new Worker(URL.createObjectURL(blob));

                var timeout = setTimeout(function() {
                    w.terminate();
                    resolve(false);
                }, CONFIG.WORKER_TIMEOUT);

                w.onmessage = function(e) {
                    if (e.data.type === 'ready') {
                        clearTimeout(timeout);
                        state.worker = w;
                        resolve(true);
                    } else if (e.data.type === 'error') {
                        clearTimeout(timeout);
                        w.terminate();
                        resolve(false);
                    }
                };
                w.onerror = function() {
                    clearTimeout(timeout);
                    w.terminate();
                    resolve(false);
                };
                w.postMessage({ type: 'init' });
            } catch (e) {
                resolve(false);
            }
        });
    }

    // ===== Frame Capture (cropped center region) =====
    function getVisibleVideoRect() {
        var vw = dom.video.videoWidth;
        var vh = dom.video.videoHeight;
        var cw = dom.video.clientWidth;
        var ch = dom.video.clientHeight;
        if (!vw || !vh || !cw || !ch) return null;

        var videoAspect = vw / vh;
        var containerAspect = cw / ch;
        var visW, visH, offX, offY;

        if (videoAspect > containerAspect) {
            visH = vh; visW = vh * containerAspect;
            offX = (vw - visW) / 2; offY = 0;
        } else {
            visW = vw; visH = vw / containerAspect;
            offX = 0; offY = (vh - visH) / 2;
        }
        return { x: offX, y: offY, w: visW, h: visH, cw: cw, ch: ch };
    }

    function captureFrame() {
        var rect = getVisibleVideoRect();
        if (!rect) return false;

        var boxRect = dom.scanRegion.getBoundingClientRect();
        var videoRect = dom.video.getBoundingClientRect();

        var relX = (boxRect.left - videoRect.left) / rect.cw;
        var relY = (boxRect.top - videoRect.top) / rect.ch;
        var relW = boxRect.width / rect.cw;
        var relH = boxRect.height / rect.ch;

        var sx = rect.x + relX * rect.w;
        var sy = rect.y + relY * rect.h;
        var sw = Math.max(10, relW * rect.w);
        var sh = Math.max(10, relH * rect.h);

        var aspect = sh / sw;
        var dw = CONFIG.DECODE_WIDTH;
        var dh = Math.max(10, Math.round(dw * aspect));

        var ctx = dom.canvas.getContext('2d', { willReadFrequently: true });
        dom.canvas.width = dw;
        dom.canvas.height = dh;
        ctx.drawImage(dom.video, sx, sy, sw, sh, 0, 0, dw, dh);
        return true;
    }

    // ===== Main-thread Decoding Fallback =====
    var mainReader = null;
    function decodeMainThread() {
        if (!mainReader) {
            var hints = new Map();
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
            mainReader = new ZXing.MultiFormatReader();
            mainReader.setHints(hints);
        }
        var ctx = dom.canvas.getContext('2d', { willReadFrequently: true });
        var imgData = ctx.getImageData(0, 0, dom.canvas.width, dom.canvas.height);
        var src = new ZXing.RGBLuminanceSource(imgData.width, imgData.height, imgData.data);
        var bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
        var result = mainReader.decode(bmp);
        return { text: result.getText(), format: result.getBarcodeFormat().toString() };
    }

    // ===== Scan Loop (throttled) =====
    function scheduleScan() {
        if (!state.scanning || state.paused) return;
        state.scanTimer = setTimeout(function() {
            if (!state.scanning || state.paused) return;
            attemptScan();
        }, CONFIG.SCAN_INTERVAL);
    }

    function attemptScan() {
        if (!captureFrame()) { scheduleScan(); return; }

        if (state.useWorker && state.worker) {
            var ctx = dom.canvas.getContext('2d', { willReadFrequently: true });
            var imgData = ctx.getImageData(0, 0, dom.canvas.width, dom.canvas.height);
            state.worker.postMessage({
                type: 'decode',
                data: imgData.data,
                width: imgData.width,
                height: imgData.height
            });
            // Worker result handled via setupWorkerHandler()
        } else {
            try {
                var result = decodeMainThread();
                handleResult(result.text, result.format);
            } catch (e) { /* No barcode found */ }
            scheduleScan();
        }
    }

    function setupWorkerHandler() {
        if (!state.worker) return;
        state.worker.onmessage = function(e) {
            if (e.data.type === 'result') {
                if (e.data.success) {
                    handleResult(e.data.text, e.data.format);
                }
                scheduleScan();
            }
        };
    }

    // ===== Result Handling =====
    function handleResult(text, format) {
        var now = Date.now();
        // Deduplicate within time window
        if (text === state.lastText && now - state.lastTime < CONFIG.DUPLICATE_WINDOW) return;
        state.lastText = text;
        state.lastTime = now;

        // Multi-sensory feedback
        playBeep();
        if (navigator.vibrate) navigator.vibrate([40, 25, 40]);

        // Visual flash on scan region
        dom.scanRegion.classList.add('detected');
        setTimeout(function() { dom.scanRegion.classList.remove('detected'); }, 400);

        // Persist to history
        saveToHistory(text, format);

        // Display result
        showResult(text, format);

        // Single-scan: stop after first detection
        if (state.mode === 'single') {
            stopScanning();
        }
    }

    function showResult(text, format) {
        clearTimeout(state.resultTimer);
        dom.resultFormat.textContent = FORMAT_NAMES[format] || format;
        dom.resultText.textContent = text;
        dom.resultPanel.classList.add('visible');

        if (state.mode === 'continuous' && state.scanning) {
            state.resultTimer = setTimeout(function() {
                dom.resultPanel.classList.remove('visible');
            }, CONFIG.RESULT_AUTO_HIDE);
        }
    }

    function hideResult() {
        clearTimeout(state.resultTimer);
        dom.resultPanel.classList.remove('visible');
    }

    // ===== Start / Stop Scanning =====
    function startScanning() {
        if (state.scanning) return;
        state.scanning = true;
        state.paused = false;
        state.lastText = '';
        state.lastTime = 0;

        dom.scanToggle.classList.add('scanning');
        dom.iconPlay.style.display = 'none';
        dom.iconStop.style.display = '';
        dom.scanLine.classList.add('active');

        setupWorkerHandler();
        scheduleScan();
    }

    function stopScanning() {
        state.scanning = false;
        state.paused = false;
        clearTimeout(state.scanTimer);

        dom.scanToggle.classList.remove('scanning');
        dom.iconPlay.style.display = '';
        dom.iconStop.style.display = 'none';
        dom.scanLine.classList.remove('active');
    }

    // ===== Scan Mode Toggle =====
    function toggleMode() {
        state.mode = state.mode === 'continuous' ? 'single' : 'continuous';
        dom.modeBadge.textContent = state.mode === 'continuous' ? 'Continuous' : 'Single Scan';
        showToast(state.mode === 'continuous' ? 'Continuous mode' : 'Single scan mode');
    }

    // ===== History (localStorage) =====
    function loadHistory() {
        try {
            return JSON.parse(localStorage.getItem(CONFIG.HISTORY_KEY)) || [];
        } catch (e) { return []; }
    }

    function saveToHistory(text, format) {
        var history = loadHistory();
        if (history.length && history[0].text === text) return;
        history.unshift({
            text: text,
            format: FORMAT_NAMES[format] || format,
            timestamp: Date.now()
        });
        if (history.length > CONFIG.MAX_HISTORY) history.length = CONFIG.MAX_HISTORY;
        try { localStorage.setItem(CONFIG.HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
    }

    function renderHistory() {
        var history = loadHistory();
        if (!history.length) {
            dom.historyList.innerHTML =
                '<div class="history-empty">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
                        '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>' +
                    '</svg>' +
                    '<p>No scans yet</p>' +
                '</div>';
            return;
        }
        var html = '';
        for (var i = 0; i < history.length; i++) {
            var item = history[i];
            var time = new Date(item.timestamp);
            var timeStr = time.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
                ' ' + time.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
            var delay = Math.min(i * 30, 300);
            html += '<div class="history-item fade-in" style="animation-delay:' + delay + 'ms" data-idx="' + i + '">' +
                '<div class="history-item-info">' +
                    '<div class="history-item-text">' + escapeHtml(item.text) + '</div>' +
                    '<div class="history-item-meta">' + escapeHtml(item.format) + ' &middot; ' + timeStr + '</div>' +
                '</div>' +
                '<button class="btn-icon" onclick="copyHistoryItem(' + i + ')" aria-label="Copy" title="Copy" ' +
                    'style="width:36px;height:36px;border-radius:10px;flex-shrink:0">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px">' +
                        '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4a2 2 0 012-2h12"/>' +
                    '</svg>' +
                '</button>' +
            '</div>';
        }
        dom.historyList.innerHTML = html;
    }

    // Exposed globally for inline onclick
    window.copyHistoryItem = function(idx) {
        var history = loadHistory();
        if (history[idx]) copyToClipboard(history[idx].text);
    };

    function clearHistory() {
        try { localStorage.removeItem(CONFIG.HISTORY_KEY); } catch (e) {}
        renderHistory();
        showToast('History cleared');
    }

    // ===== Clipboard =====
    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                showToast('Copied to clipboard');
            }).catch(function() {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        showToast('Copied to clipboard');
    }

    // ===== Manual Input =====
    function openManualInput() {
        dom.manualModal.classList.add('open');
        setTimeout(function() { dom.manualInput.focus(); }, 350);
    }

    function closeManualInput() {
        dom.manualModal.classList.remove('open');
        dom.manualInput.value = '';
    }

    function submitManualInput() {
        var val = dom.manualInput.value.trim();
        if (!val) { dom.manualInput.focus(); return; }
        playBeep();
        if (navigator.vibrate) navigator.vibrate([40, 25, 40]);
        saveToHistory(val, 'Manual');
        showResult(val, 'Manual');
        closeManualInput();
        if (state.mode === 'single' && state.scanning) stopScanning();
    }

    // ===== History Panel =====
    function openHistory() {
        renderHistory();
        dom.historyPanel.classList.add('open');
    }

    function closeHistory() {
        dom.historyPanel.classList.remove('open');
    }

    // ===== Error Display =====
    function showError(title, desc) {
        dom.errorTitle.textContent = title;
        dom.errorDesc.textContent = desc;
        showScreen('errorScreen');
    }

    // ===== HTML Escape =====
    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ===== Visibility Change (pause/resume scan loop) =====
    document.addEventListener('visibilitychange', function() {
        if (document.hidden && state.scanning) {
            state.paused = true;
            clearTimeout(state.scanTimer);
        } else if (!document.hidden && state.scanning && state.paused) {
            state.paused = false;
            scheduleScan();
        }
    });

    // ===== Cleanup =====
    window.addEventListener('beforeunload', function() {
        stopScanning();
        stopCamera();
        if (state.worker) state.worker.terminate();
    });

    // ===== Camera Request with Full Error Handling =====
    function requestCamera() {
        showScreen('loadingScreen');
        initCamera().then(function() {
            showScreen('scannerView');
            dom.scannerView.classList.add('active');
            startScanning();
        }).catch(function(e) {
            var name = e.name || '';
            var msg = e.message || '';
            if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
                showError('Camera Access Denied',
                    'Please go to your browser settings and allow camera access for this site, then try again.');
            } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
                showError('No Camera Found',
                    'No camera was detected on this device. Please connect a camera and try again.');
            } else if (name === 'NotReadableError' || name === 'TrackStartError') {
                showError('Camera Unavailable',
                    'Another app may be using the camera. Close other camera apps and try again.');
            } else if (msg === 'VIDEO_TIMEOUT') {
                showError('Camera Timeout',
                    'The camera took too long to start. Please check your connection and try again.');
            } else if (msg === 'CAMERA_UNSUPPORTED') {
                showError('Unsupported Device',
                    'Your browser or device does not support camera access. Try updating your browser.');
            } else if (msg === 'VIDEO_ERROR') {
                showError('Camera Error',
                    'An error occurred while loading the video feed. Please try again.');
            } else {
                showError('Camera Error',
                    'An unexpected error occurred while accessing the camera. Please try again.');
            }
            console.error('[ScanFlow] Camera error:', e);
        });
    }

    // ===== Main Initialization =====
    function init() {
        showScreen('loadingScreen');
        dom.scannerView.classList.remove('active');
        stopScanning();
        stopCamera();

        // Required API check
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showError('Unsupported Browser',
                'Your browser does not support camera access. Please use a modern browser like Chrome, Firefox, or Edge.');
            return;
        }

        // ZXing check
        if (typeof ZXing === 'undefined') {
            showError('Library Load Failed',
                'Failed to load the barcode scanning library. Check your internet connection and reload.');
            return;
        }

        // Initialize Web Worker in parallel
        var workerPromise = initWorker();

        workerPromise.then(function(workerReady) {
            state.useWorker = workerReady;
            console.log('[ScanFlow] Using', workerReady ? 'Web Worker' : 'main thread', 'for decoding');

            // Check existing camera permission
            var permCheck = Promise.resolve(false);
            if (navigator.permissions && navigator.permissions.query) {
                try {
                    permCheck = navigator.permissions.query({ name: 'camera' }).then(function(r) {
                        return r.state === 'granted';
                    }).catch(function() { return false; });
                } catch (e) { /* query not supported */ }
            }

            permCheck.then(function(hasPermission) {
                if (hasPermission) {
                    initCamera().then(function() {
                        showScreen('scannerView');
                        dom.scannerView.classList.add('active');
                        startScanning();
                    }).catch(function(e) {
                        if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
                            showScreen('permissionScreen');
                        } else {
                            requestCamera();
                        }
                    });
                } else {
                    showScreen('permissionScreen');
                }
            });
        });
    }

    // ===== Event Binding =====
    function bindEvents() {
        dom.grantPermBtn.addEventListener('click', requestCamera);
        dom.retryBtn.addEventListener('click', init);
        dom.scanToggle.addEventListener('click', function() {
            state.scanning ? stopScanning() : startScanning();
        });
        dom.flashBtn.addEventListener('click', toggleFlash);
        dom.modeBtn.addEventListener('click', toggleMode);
        dom.manualBtn.addEventListener('click', openManualInput);
        dom.historyBtn.addEventListener('click', openHistory);
        dom.closeHistoryBtn.addEventListener('click', closeHistory);
        dom.clearHistoryBtn.addEventListener('click', clearHistory);
        dom.copyBtn.addEventListener('click', function() {
            copyToClipboard(dom.resultText.textContent);
        });
        dom.scanAgainBtn.addEventListener('click', function() {
            hideResult();
            if (!state.scanning) startScanning();
        });
        dom.manualSubmitBtn.addEventListener('click', submitManualInput);
        dom.manualInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitManualInput();
        });
        // Close modals on backdrop tap
        dom.manualModal.addEventListener('click', function(e) {
            if (e.target === dom.manualModal) closeManualInput();
        });
        dom.historyPanel.addEventListener('click', function(e) {
            if (e.target === dom.historyPanel) closeHistory();
        });
    }

    // ===== Bootstrap =====
    function bootstrap() {
        setupPWA();
        bindEvents();

        // Short delay so the loading spinner renders
        setTimeout(function() {
            if (typeof ZXing !== 'undefined') {
                init();
            } else {
                // Poll for ZXing (CDN may still be loading)
                var checks = 0;
                var poll = setInterval(function() {
                    checks++;
                    if (typeof ZXing !== 'undefined') {
                        clearInterval(poll);
                        init();
                    } else if (checks > 150) {
                        clearInterval(poll);
                        showError('Library Load Failed',
                            'Failed to load the barcode scanning library. Check your internet connection and reload.');
                    }
                }, 100);
            }
        }, 300);
    }

    // Start
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
        bootstrap();
    }
    </script>
</body>
</html>
